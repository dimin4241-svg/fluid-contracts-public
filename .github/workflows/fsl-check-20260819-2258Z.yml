name: fSL feeOrReward check 2026-08-19T22:58Z

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - .github/workflows/fsl-check-20260819-2258Z.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - name: Check all 21 canonical Routescan URLs
        shell: bash
        run: |
          mkdir -p automation-results
          python3 - <<'PY'
          import json, urllib.request, datetime, time
          selector='0xe47a882d'
          targets=[
            ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),
            ('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
            ('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
            ('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
            ('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),
            ('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),
            ('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
            ('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),
            ('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),
            ('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
            ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),
            ('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),
            ('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),
            ('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),
            ('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),
            ('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),
            ('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),
            ('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c')]
          fallbacks={
            1:['https://ethereum-rpc.publicnode.com','https://cloudflare-eth.com'],
            8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],
            137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],
            42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],
            9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']}
          def raw32(x):
            v=int(x,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=25) as r:
              return json.loads(r.read().decode())
          def post(url,address):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':address,'data':selector},'latest']}).encode()
            req=urllib.request.Request(url,data=body,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=25) as r:
              return json.loads(r.read().decode())
          rows=[]
          for network,cid,address in targets:
            url=f'https://api.routescan.io/v2/network/mainnet/evm/{cid}/etherscan/api?action=eth_call&data={selector}&module=proxy&tag=latest&to={address}'
            rec={'network':network,'chain_id':cid,'address':address,'canonical_routescan_url':url}
            result=None
            try:
              j=get(url); rec['routescan_payload']=j
              result=j.get('result')
              if not isinstance(result,str) or not result.startswith('0x'):
                raise RuntimeError(repr(j))
              rec['source']='routescan'
            except Exception as e:
              rec['routescan_error']=repr(e)
              for rpc in fallbacks[cid]:
                try:
                  j=post(rpc,address); rr=j.get('result')
                  if not isinstance(rr,str) or not rr.startswith('0x'):
                    raise RuntimeError(repr(j))
                  result=rr; rec['source']='fallback:'+rpc; break
                except Exception as ee:
                  rec.setdefault('fallback_errors',[]).append(f'{rpc}: {ee!r}')
            if isinstance(result,str) and result.startswith('0x'):
              raw=raw32(result)
              rec.update(result=result,raw_int32=raw,annual_percent=raw/10000,confirmed=True)
              if raw != 0:
                confirmations=[]
                for rpc in fallbacks[cid]:
                  if rec.get('source')=='fallback:'+rpc: continue
                  try:
                    j=post(rpc,address); rr=j.get('result')
                    if isinstance(rr,str) and rr.startswith('0x'):
                      confirmations.append({'rpc':rpc,'result':rr,'raw_int32':raw32(rr),'matches':rr.lower()==result.lower()})
                      if rr.lower()==result.lower(): break
                  except Exception as ee:
                    confirmations.append({'rpc':rpc,'error':repr(ee)})
                rec['independent_confirmations']=confirmations
                rec['independently_confirmed_nonzero']=any(c.get('matches') and c.get('raw_int32')!=0 for c in confirmations)
            else:
              rec['confirmed']=False
            rows.append(rec)
          nz=[r for r in rows if r.get('raw_int32',0)!=0]
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'target_count':len(rows),'success_count':sum(bool(r.get('confirmed')) for r in rows),'failure_count':sum(not bool(r.get('confirmed')) for r in rows),'nonzero':nz,'results':rows}
          with open('automation-results/fsl-20260819-2258Z.json','w') as f: json.dump(out,f,indent=2,sort_keys=True)
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation-results/fsl-20260819-2258Z.json
          git commit -m 'Store fSL check result 2026-08-19T22:58Z' || exit 0
          git push
