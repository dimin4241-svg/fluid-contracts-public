name: Security Sky atomic oracle retirement proof

on:
  push:
    branches:
      - audit/sky-ilk-registry-race-runner-20260806
    paths:
      - '.github/workflows/security-sky-atomic-oracle-retirement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Sky PoC branch
        uses: actions/checkout@v4
        with:
          repository: dimin4241-svg/dss-emergency-spells
          ref: audit/ilk-registry-readd-proof
          path: sky-poc
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run atomic end-to-end proof with RPC failover
        shell: bash
        working-directory: sky-poc
        run: |
          set -euo pipefail
          mkdir -p ../evidence-sky-atomic-oracle-retirement
          endpoints=(
            'https://ethereum-rpc.publicnode.com'
            'https://eth.drpc.org'
            'https://mainnet.gateway.tenderly.co'
            'https://eth-mainnet.public.blastapi.io'
            'https://rpc.payload.de'
          )
          forge build 2>&1 | tee ../evidence-sky-atomic-oracle-retirement/forge-build.log
          passed=0
          for rpc in "${endpoints[@]}"; do
            log=../evidence-sky-atomic-oracle-retirement/forge-test.log
            set +e
            ETH_RPC_URL="$rpc" forge test \
              --match-path src/IlkRegistryAtomicOracleRetirementProof.t.sol \
              --match-test testOneExternalCallReactivatesRetiredOraclePathIntoVat \
              -vvvv > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [[ $rc -eq 0 ]] && grep -q '\[PASS\]' "$log"; then
              echo "CASE_PASS atomic-oracle-retirement rpc=$rpc" | tee ../evidence-sky-atomic-oracle-retirement/summary.log
              passed=1
              break
            fi
          done
          [[ $passed -eq 1 ]]
          grep -E '(approved spell done|Chainlog keys still retired|Registry ilks restored|retired ilks recached|Vat.spot values changed|final Registry count|end-to-end call gas|block gas limit|PASS|Suite result)' "$log" \
            | tee ../evidence-sky-atomic-oracle-retirement/key-results.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-atomic-oracle-retirement-proof
          path: evidence-sky-atomic-oracle-retirement/
          if-no-files-found: error
          retention-days: 30
