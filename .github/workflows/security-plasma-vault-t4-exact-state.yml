name: Security Plasma Vault T4 exact state

on:
  push:
    branches:
      - audit/plasma-t4-exact-debt-controls-20260806
    paths:
      - 'test/security/PlasmaVaultT4ExactStateProbe.t.sol'
      - '.github/workflows/security-plasma-vault-t4-exact-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
      PLASMA_FORK_BLOCK: 29082579
      CLAIMED_FORK_BLOCK: 12386164
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Record claimed-block absence
        shell: bash
        run: |
          mkdir -p evidence-plasma-vault-t4-exact-state
          {
            echo "claimed_block=$CLAIMED_FORK_BLOCK"
            echo "vault_code=$(cast code 0x6E0Cdb5c21B3c8E340E9C9210057035bAfA86ffF --rpc-url \"$PLASMA_RPC_URL\" --block \"$CLAIMED_FORK_BLOCK\")"
            echo "dex_code=$(cast code 0xbd5dD095d9a6565C8222bb36B5814953F1C46f71 --rpc-url \"$PLASMA_RPC_URL\" --block \"$CLAIMED_FORK_BLOCK\")"
            echo "tested_live_block=$PLASMA_FORK_BLOCK"
          } | tee evidence-plasma-vault-t4-exact-state/claimed-vs-live.txt
      - name: Prepare isolated probe
        shell: bash
        run: |
          rm -rf audit/t4-exact-state
          mkdir -p audit/t4-exact-state/test audit/t4-exact-state/lib evidence-plasma-vault-t4-exact-state
          cp test/security/PlasmaVaultT4ExactStateProbe.t.sol audit/t4-exact-state/test/
          cp -R lib/forge-std audit/t4-exact-state/lib/forge-std
      - name: Run exact recorded-live-state probe
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/t4-exact-state --via-ir \
            --match-path test/PlasmaVaultT4ExactStateProbe.t.sol -vvvv 2>&1 \
            | tee evidence-plasma-vault-t4-exact-state/exact-state.log
      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E "(ExactStateHeader|ConstantsRaw|ConstantsDecoded|TokenMetadata|DexMetadata|CandidateState)\(|Suite result|Failing tests|Error:|revert" \
            evidence-plasma-vault-t4-exact-state/exact-state.log \
            | tee evidence-plasma-vault-t4-exact-state/summary.log || true
          printf '%s\n' "$PLASMA_FORK_BLOCK" > evidence-plasma-vault-t4-exact-state/block.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-vault-t4-exact-state
          path: evidence-plasma-vault-t4-exact-state/
          if-no-files-found: error
          retention-days: 30
