          def raw32(result):
            v=int(result,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def get_json(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read().decode())
          def post_rpc(url,address):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":"eth_call","params":[{"to":address,"data":"0xe47a882d"},"latest"]}).encode()
            req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json","User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read().decode())
          output=[]
          for network,cid,address,url in targets:
            rec={"network":network,"chain_id":cid,"address":address,"url":url}
            try:
              j=get_json(url); result=j.get("result")
              if not isinstance(result,str) or not result.startswith("0x"): raise RuntimeError(str(j))
              rec.update(source="routescan",result=result,raw=raw32(result),annual_percent=raw32(result)/10000)
            except Exception as e:
              rec["routescan_error"]=repr(e); ok=False
              for rpc in fallback.get(cid,[]):
                try:
                  j=post_rpc(rpc,address); result=j.get("result")
                  if not isinstance(result,str) or not result.startswith("0x"): raise RuntimeError(str(j))
                  rec.update(source=rpc,result=result,raw=raw32(result),annual_percent=raw32(result)/10000); ok=True; break
                except Exception as ee: rec.setdefault("fallback_errors",[]).append(f"{rpc}: {ee!r}")
              if not ok: rec["unconfirmed"]=True
            print("FSL_RESULT "+json.dumps(rec,sort_keys=True))
            output.append(rec)
          summary={"total":len(output),"confirmed":sum('raw' in r for r in output),"unconfirmed":sum(r.get('unconfirmed',False) for r in output),"nonzero":[r for r in output if r.get('raw',0)!=0]}
          print("FSL_SUMMARY "+json.dumps(summary,sort_keys=True))
          if summary["unconfirmed"]: raise SystemExit(2)
          if summary["nonzero"]: raise SystemExit(10)
          PY
