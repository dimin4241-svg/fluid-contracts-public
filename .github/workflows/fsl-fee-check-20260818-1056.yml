          ]
          FALLBACK={
            1:['https://ethereum-rpc.publicnode.com','https://rpc.ankr.com/eth'],
            8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],
            137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],
            42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],
            9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com'],
          }
          def dec32(x):
            v=int(x,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def rpc_call(s,rpc,address):
            payload={'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':address,'data':SELECTOR},'latest']}
            rr=s.post(rpc,json=payload,timeout=25); rr.raise_for_status(); jj=rr.json(); x=jj.get('result')
            if not (isinstance(x,str) and x.startswith('0x')): raise RuntimeError(f'bad payload {jj}')
            return x
          s=requests.Session(); s.headers['User-Agent']='fsl-canonical-watch/2026-08-18'
          rows=[]; failures=[]
          for network,chain,address,url in TARGETS:
            result=None; source=None; errs=[]
            for attempt in range(3):
              try:
                r=s.get(url,timeout=25); r.raise_for_status(); j=r.json(); x=j.get('result')
                if isinstance(x,str) and x.startswith('0x'):
                  result=x; source='routescan'; break
                errs.append(f'payload={j}')
              except Exception as e:
                errs.append(repr(e))
              time.sleep(1+attempt)
            if result is None:
              for rpc in FALLBACK.get(chain,[]):
                try:
                  result=rpc_call(s,rpc,address); source=rpc; break
                except Exception as e: errs.append(f'{rpc}: {e!r}')
            if result is None:
              failures.append({'network':network,'chain_id':chain,'address':address,'url':url,'errors':errs}); continue
            raw=dec32(result)
            row={'network':network,'chain_id':chain,'address':address,'url':url,'source':source,'result':result,'raw_int32':raw,'annual_percent':raw/10000}
            if raw != 0:
              confirmations=[]
              for rpc in FALLBACK.get(chain,[]):
                try:
                  x=rpc_call(s,rpc,address); confirmations.append({'rpc':rpc,'result':x,'raw_int32':dec32(x),'match':x.lower()==result.lower()})
                except Exception as e: confirmations.append({'rpc':rpc,'error':repr(e)})
              row['independent_confirmations']=confirmations
            rows.append(row)
          out={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'target_count':len(TARGETS),'success_count':len(rows),'failure_count':len(failures),'nonzero':[r for r in rows if r['raw_int32']!=0],'results':rows,'failures':failures}
          os.makedirs('security-results',exist_ok=True)
          with open('security-results/fsl-fee-check-20260818-1056.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY
