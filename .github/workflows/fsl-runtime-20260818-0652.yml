          rpcs={
            1:['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com'],
            8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],
            137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],
            42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],
            9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']
          }
          def dec32(h):
              x=int(h,16)&0xffffffff
              return x-(1<<32) if x&0x80000000 else x
          def get_json(url, attempts=3):
              last=None
              for a in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode())
                  except Exception as e:
                      last=repr(e); time.sleep(1+a)
              raise RuntimeError(last)
          def rpc_call(url, addr):
              data=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':addr,'data':selector},'latest']}).encode()
              req=urllib.request.Request(url,data=data,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  j=json.loads(r.read().decode())
              if not isinstance(j.get('result'),str): raise RuntimeError(str(j))
              return j['result']
          out=[]; errors=[]; nonzero=[]
          checked=datetime.datetime.now(datetime.timezone.utc).isoformat()
          for i,(net,cid,addr,url) in enumerate(urls,1):
              try:
                  j=get_json(url); result=j.get('result')
                  if not isinstance(result,str) or not result.startswith('0x'): raise RuntimeError('bad payload '+json.dumps(j))
                  raw=dec32(result)
                  row={'i':i,'network':net,'chain_id':cid,'address':addr,'result':result,'raw':raw,'annual_percent':raw/10000,'source':'routescan'}
              except Exception as e:
                  row=None; fb=[]
                  for rpc in rpcs.get(cid,[]):
                      try:
                          rr=rpc_call(rpc,addr); raw=dec32(rr); row={'i':i,'network':net,'chain_id':cid,'address':addr,'result':rr,'raw':raw,'annual_percent':raw/10000,'source':rpc,'routescan_error':repr(e)}; break
                      except Exception as fe: fb.append(rpc+': '+repr(fe))
                  if row is None:
                      errors.append({'i':i,'network':net,'chain_id':cid,'address':addr,'routescan_error':repr(e),'fallback_errors':fb})
                      print('ROW '+json.dumps(errors[-1]),flush=True); continue
              print('ROW '+json.dumps(row),flush=True); out.append(row)
              if row['raw']!=0:
                  confirms=[]
                  for rpc in rpcs.get(cid,[]):
                      try:
                          rr=rpc_call(rpc,addr); confirms.append({'rpc':rpc,'result':rr,'raw':dec32(rr)})
                      except Exception as ce: confirms.append({'rpc':rpc,'error':repr(ce)})
                  row['independent_confirmations']=confirms; nonzero.append(row)
                  print('NONZERO '+json.dumps(row),flush=True)
          print('SUMMARY '+json.dumps({'checked_at_utc':checked,'success_count':len(out),'error_count':len(errors),'nonzero':nonzero,'errors':errors}),flush=True)
