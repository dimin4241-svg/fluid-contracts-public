name: Security Sky canonical IlkRegistry validation

on:
  push:
    branches:
      - audit/sky-ilk-registry-race-runner-20260806
    paths:
      - '.github/workflows/security-sky-full-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Sky PoC branch
        uses: actions/checkout@v4
        with:
          repository: dimin4241-svg/dss-emergency-spells
          ref: audit/ilk-registry-readd-proof
          path: sky-poc
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Record reproducible fork baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-sky-full-validation
          REG=0x5a464C28D19848f44199D003BeF5ecc87d090F87
          endpoints=(
            'https://mainnet.gateway.tenderly.co'
            'https://ethereum-rpc.publicnode.com'
            'https://eth.drpc.org'
            'https://rpc.payload.de'
            'https://eth-mainnet.public.blastapi.io'
          )
          for rpc in "${endpoints[@]}"; do
            historical=$(timeout 30 cast call "$REG" 'count()(uint256)' --block 23118263 --rpc-url "$rpc" 2>/dev/null || true)
            snapshot=$(timeout 30 cast call "$REG" 'count()(uint256)' --block 25694337 --rpc-url "$rpc" 2>/dev/null || true)
            if [[ "$historical" =~ ^72 ]] && [[ "$snapshot" =~ ^35 ]]; then
              {
                echo "baseline_rpc=$rpc"
                echo "historical_block_23118263_count=$historical"
                echo "snapshot_block_25694337_count=$snapshot"
              } | tee evidence-sky-full-validation/baselines.log
              exit 0
            fi
          done
          echo 'No archive RPC reproduced both pinned baselines' >&2
          exit 1

      - name: Build all PoC contracts with standard compiler
        shell: bash
        working-directory: sky-poc
        run: |
          set -o pipefail
          forge build 2>&1 | tee ../evidence-sky-full-validation/forge-build.log

      - name: Run canonical proofs sequentially with RPC failover
        shell: bash
        working-directory: sky-poc
        run: |
          set -uo pipefail
          : > ../evidence-sky-full-validation/forge-test.log
          endpoints=(
            'https://mainnet.gateway.tenderly.co'
            'https://ethereum-rpc.publicnode.com'
            'https://eth.drpc.org'
            'https://rpc.payload.de'
            'https://eth-mainnet.public.blastapi.io'
          )

          run_case() {
            local label="$1"
            shift
            local tmp="../evidence-sky-full-validation/${label}.log"
            local rpc rc
            for rpc in "${endpoints[@]}"; do
              echo "=== $label via $rpc ===" | tee -a ../evidence-sky-full-validation/forge-test.log
              ETH_RPC_URL="$rpc" forge test --threads 1 "$@" -vv 2>&1 | tee "$tmp"
              rc=${PIPESTATUS[0]}
              cat "$tmp" >> ../evidence-sky-full-validation/forge-test.log
              if [[ "$rc" == 0 ]]; then
                echo "CASE_PASS $label rpc=$rpc" | tee -a ../evidence-sky-full-validation/forge-test.log
                return 0
              fi
              if grep -qiE '429|rate limit|Max retries exceeded|failed to send/recv|database error' "$tmp"; then
                echo "RPC_RETRY $label rpc=$rpc" | tee -a ../evidence-sky-full-validation/forge-test.log
                sleep 3
                continue
              fi
              echo "CASE_FAIL_NON_RPC $label rpc=$rpc" | tee -a ../evidence-sky-full-validation/forge-test.log
              return "$rc"
            done
            echo "CASE_FAIL_ALL_RPCS $label" | tee -a ../evidence-sky-full-validation/forge-test.log
            return 1
          }

          run_case atomic-governance-reversal \
            --match-path src/IlkRegistryAtomicGovernanceReversal.t.sol \
            --match-test testOneUnprivilegedTransactionCastsSpellAndReversesCleanup || exit 1
          sleep 3

          run_case historical-mass-restoration \
            --match-path src/IlkRegistryMassReAdd.t.sol \
            --match-test testAttackerMassReAddsGovernanceRemovedIlks || exit 1
          sleep 3

          run_case current-exact-restoration \
            --match-path src/IlkRegistryCurrentMassReAdd.t.sol \
            --match-test testCurrentMainnetOneTransactionRestoresExactly31RemovedIlks || exit 1
          sleep 3

          run_case residual-art-negative-control \
            --match-path src/IlkRegistryCurrentMassReAdd.t.sol \
            --match-test testRwaAdaptersWithResidualArtAreNotPermissionlesslyAddable || exit 1
          sleep 3

          run_case omega-poker-downstream \
            --match-path src/IlkRegistryOmegaPokerImpact.t.sol \
            --match-test testMassReAddChangesDeployedOmegaPokerExecution || exit 1
          sleep 3

          run_case persistence-and-mitigation \
            --match-path src/IlkRegistryPersistence.t.sol || exit 1
          sleep 3

          run_case keeper-bounded-impact \
            --match-path src/IlkRegistryKeeperGas.t.sol \
            --match-test testCompareAllActiveKeeperJobsAndSequencerBatch || exit 1

      - name: Extract validation summary
        if: always()
        shell: bash
        run: |
          {
            cat evidence-sky-full-validation/baselines.log 2>/dev/null || true
            echo '--- build ---'
            grep -E '(Compiling|Compiler run successful|Error:|Warning)' evidence-sky-full-validation/forge-build.log 2>/dev/null || true
            echo '--- canonical cases ---'
            grep -E '(CASE_PASS|CASE_FAIL|RPC_RETRY|Suite result|\[PASS\]|\[FAIL\])' evidence-sky-full-validation/forge-test.log 2>/dev/null || true
          } | tee evidence-sky-full-validation/summary.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-canonical-ilk-registry-validation
          path: evidence-sky-full-validation/
          if-no-files-found: error
          retention-days: 30
