name: fSL feeOrReward one-shot
on:
  push:
    paths:
      - '.github/workflows/fsl-watch-now.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check 21 deployed fSL contracts
        shell: python
        run: |
          import requests, json, concurrent.futures, datetime

          selector='0xe47a882d'
          targets='''8453 0x4563134183e45D9502015db14B263E31781099bB
          8453 0x983107BB3dcb71f3A30176114D8a17c454A62514
          8453 0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6
          8453 0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A
          9745 0x983107BB3dcb71f3A30176114D8a17c454A62514
          9745 0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A
          137 0xa779B6736385930145F4856226Cd3E3691B72458
          137 0x4563134183e45D9502015db14B263E31781099bB
          137 0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6
          137 0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A
          42161 0x82C53239c4CFC89A8E55A691422af24c18A944b1
          42161 0x1F0bFd9862ae58208d26db0d80797974434EC013
          42161 0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E
          1 0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1
          1 0x9b1f75ea07723F331996831f6d04AD4900d1A3B3
          1 0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF
          1 0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2
          1 0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f
          1 0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6
          1 0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70
          1 0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c'''
          items=[line.split() for line in targets.splitlines()]
          fallbacks={
            '1':['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com'],
            '8453':['https://base-rpc.publicnode.com','https://mainnet.base.org'],
            '137':['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],
            '42161':['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],
            '9745':['https://rpc.plasma.to','https://plasma-rpc.publicnode.com'],
          }
          def decode(x):
            v=int(x,16)&0xffffffff
            return v-(1<<32) if v&(1<<31) else v
          def get_one(pair):
            chain,address=pair
            u=f'https://api.routescan.io/v2/network/mainnet/evm/{chain}/etherscan/api?action=eth_call&data={selector}&module=proxy&tag=latest&to={address}'
            out={'chain':chain,'address':address,'routescan_url':u}
            try:
              r=requests.get(u,timeout=20); out['routescan_http']=r.status_code; out['routescan_body']=r.text[:500]
              j=r.json(); result=j.get('result')
              if isinstance(result,str) and result.startswith('0x'):
                out['result']=result; out['raw']=decode(result); out['apr_pct']=out['raw']/10000; out['source']='routescan'; return out
            except Exception as e: out['routescan_error']=repr(e)
            payload={'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':address,'data':selector},'latest']}
            errs=[]
            for rpc in fallbacks.get(chain,[]):
              try:
                rr=requests.post(rpc,json=payload,timeout=20); jj=rr.json(); result=jj.get('result')
                if isinstance(result,str) and result.startswith('0x'):
                  out['result']=result; out['raw']=decode(result); out['apr_pct']=out['raw']/10000; out['source']=rpc; return out
                errs.append([rpc,rr.status_code,rr.text[:300]])
              except Exception as e: errs.append([rpc,repr(e)])
            out['fallback_errors']=errs; return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=21) as ex:
            rows=list(ex.map(get_one,items))
          print('CHECKED_AT_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat())
          print('RESULT_JSON_BEGIN')
          print(json.dumps(rows,indent=2))
          print('RESULT_JSON_END')
          bad=[x for x in rows if 'result' not in x]
          nz=[x for x in rows if x.get('raw',0)!=0]
          print('SUMMARY',json.dumps({'total':len(rows),'confirmed':len(rows)-len(bad),'failed':len(bad),'nonzero':len(nz)}))
          if bad:
            raise SystemExit(2)
