name: Security deployed WBTC-cbBTC extraction proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-bitcoin-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated harness
        run: |
          mkdir -p audit/fork-poc/src audit/fork-poc/test
          cp test/security/ActiveWbtcCbbtcRoundingExtraction.t.sol audit/fork-poc/test/
      - name: Run deployed WBTC-cbBTC proof
        run: |
          set -o pipefail
          forge test --root audit/fork-poc --via-ir \
            --match-path test/ActiveWbtcCbbtcRoundingExtraction.t.sol \
            -vvvv 2>&1 | tee active-wbtc-cbbtc-extraction.log
      - name: Upload proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-wbtc-cbbtc-extraction-log
          path: active-wbtc-cbbtc-extraction.log
          if-no-files-found: error
