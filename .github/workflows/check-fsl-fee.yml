name: Check fSL feeOrReward

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - scripts/security/check_fsl_fee_or_reward.py
      - .github/workflows/check-fsl-fee.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run exhaustive on-chain check
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > scripts/security/fsl_fee_or_reward_latest.json 2> scripts/security/fsl_fee_or_reward_latest.err
          code=$?
          echo "$code" > scripts/security/fsl_fee_or_reward_latest.exit
          exit 0
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/security/fsl_fee_or_reward_latest.json scripts/security/fsl_fee_or_reward_latest.err scripts/security/fsl_fee_or_reward_latest.exit
          git commit -m "Record latest fSL feeOrReward check" || exit 0
          git push origin HEAD:audit/read-only-dex-fees-20260805

