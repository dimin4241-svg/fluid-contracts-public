name: Security Plasma atomic no-synthetic proof

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - 'test/security/PlasmaGhoUsdtAtomicNoSynthetic.t.sol'
      - '.github/workflows/security-plasma-atomic-no-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLASMA_RPC_URL: 'https://rpc.plasma.to'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Pin deployed state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/fork-poc/test evidence-plasma-atomic
          BLOCK="$(cast block-number --rpc-url "${PLASMA_RPC_URL}")"
          GAS_PRICE="$(cast gas-price --rpc-url "${PLASMA_RPC_URL}")"
          {
            echo "PLASMA_FORK_BLOCK=${BLOCK}"
            echo "PLASMA_GAS_PRICE_WEI=${GAS_PRICE}"
          } >> "${GITHUB_ENV}"
          {
            echo "fork_block=${BLOCK}"
            echo "gas_price_wei=${GAS_PRICE}"
          } | tee evidence-plasma-atomic/deployed-state.txt
          cast block "${BLOCK}" --json --rpc-url "${PLASMA_RPC_URL}" > evidence-plasma-atomic/fork-block.json
      - name: Prepare isolated harness
        run: cp test/security/PlasmaGhoUsdtAtomicNoSynthetic.t.sol audit/fork-poc/test/
      - name: Run atomic deployed fork proof
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/fork-poc --via-ir \
            --match-path test/PlasmaGhoUsdtAtomicNoSynthetic.t.sol \
            -vvvv 2>&1 | tee evidence-plasma-atomic/proof.log
      - name: Extract summary
        if: always()
        shell: bash
        run: |
          grep -E 'AtomicExistingFundsProof\(|Suite result|Failing tests|Compiler run failed|Error:' \
            evidence-plasma-atomic/proof.log \
            | tee evidence-plasma-atomic/summary.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-atomic-no-synthetic-proof
          path: evidence-plasma-atomic/
          if-no-files-found: error
          retention-days: 30
