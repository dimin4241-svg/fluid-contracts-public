name: fSL feeOrReward check
on:
  push:
    paths:
      - '.github/workflows/fsl-feeorreward-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query fallback RPCs for Routescan-unsupported chains
        shell: python
        run: |
          import requests, json
          from concurrent.futures import ThreadPoolExecutor, as_completed
          targets = [
            ('Base',8453,'https://mainnet.base.org','0x4563134183e45D9502015db14B263E31781099bB'),('Base',8453,'https://mainnet.base.org','0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Base',8453,'https://mainnet.base.org','0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Base',8453,'https://mainnet.base.org','0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Polygon',137,'https://polygon-rpc.com','0xa779B6736385930145F4856226Cd3E3691B72458'),('Polygon',137,'https://polygon-rpc.com','0x4563134183e45D9502015db14B263E31781099bB'),('Polygon',137,'https://polygon-rpc.com','0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Polygon',137,'https://polygon-rpc.com','0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Arbitrum',42161,'https://arb1.arbitrum.io/rpc','0x82C53239c4CFC89A8E55A691422af24c18A944b1'),('Arbitrum',42161,'https://arb1.arbitrum.io/rpc','0x1F0bFd9862ae58208d26db0d80797974434EC013'),('Arbitrum',42161,'https://arb1.arbitrum.io/rpc','0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E')]
          def check(t):
            net,cid,rpc,addr=t
            p={'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':addr,'data':'0xe47a882d'},'latest']}
            try:
              r=requests.post(rpc,json=p,timeout=10); body=r.text.strip(); d=r.json(); result=d.get('result')
              if isinstance(result,str) and result.startswith('0x'):
                v=int(result,16)&0xffffffff; raw=v-(1<<32) if v&0x80000000 else v
                return {'network':net,'chain_id':cid,'rpc':rpc,'address':addr,'result':result,'raw':raw,'annual_percent':raw/10000}
              return {'network':net,'chain_id':cid,'rpc':rpc,'address':addr,'ERROR':body[:500]}
            except Exception as e:
              return {'network':net,'chain_id':cid,'rpc':rpc,'address':addr,'ERROR':repr(e)}
          with ThreadPoolExecutor(max_workers=11) as ex:
            rows=[f.result() for f in as_completed([ex.submit(check,t) for t in targets])]
          rows.sort(key=lambda x:(x['chain_id'],x['address'].lower()))
          for row in rows: print(json.dumps(row,separators=(',',':')))
          print('SUMMARY',json.dumps({'count':len(rows),'errors':sum('ERROR' in r for r in rows),'nonzero':sum(r.get('raw',0)!=0 for r in rows)},separators=(',',':')))
