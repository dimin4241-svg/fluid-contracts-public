name: fSL live feeOrReward check

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - .github/workflows/fsl-live-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Run exhaustive on-chain check
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > fsl-output.json 2> fsl-stderr.txt
          code=$?
          echo "$code" > fsl-exit-code.txt
          cat fsl-output.json
          cat fsl-stderr.txt >&2
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-live-check
          path: |
            fsl-output.json
            fsl-stderr.txt
            fsl-exit-code.txt
