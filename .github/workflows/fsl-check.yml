name: fSL feeOrReward check

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check all fSL feeOrReward values
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee fsl-check.json
          echo "checker_exit=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0
      - name: Persist result in branch
        if: always()
        shell: bash
        run: |
          mkdir -p automation-results
          cp fsl-check.json automation-results/fsl-check-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation-results/fsl-check-latest.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "Record fresh fSL feeOrReward check"
            git push origin HEAD:audit/read-only-dex-fees-20260805
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsl-check
          path: fsl-check.json

