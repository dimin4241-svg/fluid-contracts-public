name: fSL feeOrReward check

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check all fSL feeOrReward values
        run: python scripts/security/check_fsl_fee_or_reward.py | tee fsl-check.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsl-check
          path: fsl-check.json

