name: fSL feeOrReward check
on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install requests
      - name: Run checker
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee fsl-output.json
          code=${PIPESTATUS[0]}
          echo "checker_exit=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: fsl-output
          path: fsl-output.json
