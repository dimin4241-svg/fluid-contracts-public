name: Exact current fSL feeOrReward runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fsl-exact-current-runtime.yml'
      - 'scripts/security/check_fsl_exact_current.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Run exact all-21 check
        shell: bash
        run: |
          mkdir -p automation
          set +e
          python scripts/security/check_fsl_exact_current.py | tee automation/fsl-current-stdout.txt
          code=${PIPESTATUS[0]}
          echo "$code" > automation/fsl-current-exit.txt
          exit 0
      - name: Persist result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/fsl-current-result.json automation/fsl-current-exit.txt
          git diff --cached --quiet || git commit -m "Record current exact fSL verification"
          git push origin HEAD:main

