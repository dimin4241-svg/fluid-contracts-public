name: Security Plasma GHO-USDT forensic extraction proof

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - 'test/security/PlasmaGhoUsdtForensicProof.t.sol'
      - '.github/workflows/security-plasma-gho-usdt-forensic-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
      USDT0: 0xB8CE59FC3717ada4C02eaDF9682A9e934F625ebb
      USDT0_LIVE_HOLDER: 0x8741B106e9738a6971AD07DABCFe95FF66337b51
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Pin deployed state and gas conditions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-plasma-forensic audit/fork-poc/test
          LATEST="$(cast block-number --rpc-url "${PLASMA_RPC_URL}")"
          GAS_PRICE="$(cast gas-price --rpc-url "${PLASMA_RPC_URL}")"
          HOLDER_BALANCE="$(cast call "${USDT0}" 'balanceOf(address)(uint256)' "${USDT0_LIVE_HOLDER}" --block "${LATEST}" --rpc-url "${PLASMA_RPC_URL}")"
          BLOCK_GAS_LIMIT="$(cast block "${LATEST}" gasLimit --rpc-url "${PLASMA_RPC_URL}")"
          {
            echo "PLASMA_FORK_BLOCK=${LATEST}"
            echo "PLASMA_GAS_PRICE_WEI=${GAS_PRICE}"
          } >> "${GITHUB_ENV}"
          {
            echo "fork_block=${LATEST}"
            echo "gas_price_wei=${GAS_PRICE}"
            echo "block_gas_limit=${BLOCK_GAS_LIMIT}"
            echo "live_holder=${USDT0_LIVE_HOLDER}"
            echo "live_holder_usdt0_raw=${HOLDER_BALANCE}"
          } | tee evidence-plasma-forensic/deployed-state.txt
          cast block "${LATEST}" --json --rpc-url "${PLASMA_RPC_URL}" \
            > evidence-plasma-forensic/fork-block.json

      - name: Prepare isolated harness
        shell: bash
        run: |
          cp test/security/PlasmaGhoUsdtForensicProof.t.sol audit/fork-poc/test/

      - name: Run no-synthetic-balance deployed fork proof
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/fork-poc --via-ir \
            --match-path test/PlasmaGhoUsdtForensicProof.t.sol \
            -vvvv 2>&1 | tee evidence-plasma-forensic/forensic-proof.log

      - name: Extract triage-ready evidence
        if: always()
        shell: bash
        run: |
          grep -E 'ForensicDeployment\(|ForensicAtomicProof\(|ForensicSequence\(|ForensicRepeatedProof\(|ForensicRoundingSensitivity\(|Suite result|Failing tests|Compiler run failed|Error:' \
            evidence-plasma-forensic/forensic-proof.log \
            | tee evidence-plasma-forensic/forensic-summary.log || true

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-gho-usdt-forensic-proof
          path: evidence-plasma-forensic/
          if-no-files-found: error
          retention-days: 30
