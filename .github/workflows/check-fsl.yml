name: Check fSL feeOrReward
on:
  push:
    branches: [audit/read-only-dex-fees-20260805]
    paths:
      - '.github/workflows/check-fsl.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run exhaustive fSL check
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee fsl-check.json
          code=${PIPESTATUS[0]}
          echo "checker_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
        id: checker
      - name: Show result
        run: cat fsl-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-check
          path: fsl-check.json
