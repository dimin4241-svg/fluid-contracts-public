name: fSL feeOrReward check 2026-08-29 22:49Z

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - .github/workflows/fsl-check-20260830-0349.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - name: Check all 21 fSL feeOrReward values and persist result
        shell: bash
        run: |
          set -u
          python3 -m pip install requests
          mkdir -p artifacts
          set +e
          python3 scripts/security/check_fsl_fee_or_reward.py > artifacts/fsl-watch-latest.json
          rc=$?
          set -e
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('artifacts/fsl-watch-latest.json')
          data = json.loads(p.read_text())
          data['workflow_recorded_at_utc'] = __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/fsl-watch-latest.json
          git commit -m "Record latest fSL feeOrReward check" || true
          git push origin HEAD:audit/read-only-dex-fees-20260805
          exit $rc
