name: Plasma T4 one-sided borrow V2

on:
  push:
    branches:
      - audit/plasma-t4-liquidation-20260806
    paths:
      - '.github/workflows/plasma-t4-one-sided-borrow-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feasible-one-sided:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
      PLASMA_FORK_BLOCK: 29082579
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated V2 probe
        shell: bash
        run: |
          rm -rf audit/one-sided-v2
          mkdir -p audit/one-sided-v2/test audit/one-sided-v2/lib evidence-one-sided-v2
          cp test/security/PlasmaVaultT4PureDexDebtCloseMatrixV2.t.sol audit/one-sided-v2/test/
          cp test/security/PlasmaVaultT4LiquidationSurfaceProbe.t.sol audit/one-sided-v2/test/
          cp test/security/PlasmaVaultT4OneSidedBorrowLiquidation.t.sol audit/one-sided-v2/test/
          cp test/security/PlasmaVaultT4OneSidedBorrowLiquidationV2.t.sol audit/one-sided-v2/test/
          cp -R lib/forge-std audit/one-sided-v2/lib/forge-std
      - name: Run feasible one-sided borrow probe
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/one-sided-v2 --via-ir \
            --match-contract PlasmaVaultT4OneSidedBorrowLiquidationV2Test \
            --match-test test_feasibleOneSidedBorrowLiquidation -vvvv 2>&1 \
            | tee evidence-one-sided-v2/one-sided-v2.log
      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E '(FeasibleCase|FeasibleDeposit|FeasibleBorrow|FeasibleLiquidation)\(|Suite result|Failing tests|Error:|revert' \
            evidence-one-sided-v2/one-sided-v2.log | tee evidence-one-sided-v2/summary.log || true
          echo "$PLASMA_FORK_BLOCK" > evidence-one-sided-v2/block.txt
          git rev-parse HEAD > evidence-one-sided-v2/commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-t4-one-sided-borrow-v2
          path: evidence-one-sided-v2/
          if-no-files-found: error
          retention-days: 30
