name: fSL feeOrReward check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fsl-check-now.yml
      - scripts/security/check_fsl_fee_or_reward.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Run complete on-chain check
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > fsl_latest.json
          rc=$?
          echo "$rc" > fsl_latest.exitcode
          exit 0
      - name: Commit result snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fsl_latest.json fsl_latest.exitcode
          git commit -m "Record latest fSL feeOrReward check [skip ci]" || exit 0
          git push origin HEAD:audit/read-only-dex-fees-20260805
