name: fSL feeOrReward checker
on:
  push:
    paths:
      - '.github/workflows/fsl-watch-run.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Run exhaustive fSL check
        run: python scripts/security/check_fsl_fee_or_reward.py
