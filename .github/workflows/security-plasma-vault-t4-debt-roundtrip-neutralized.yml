name: Security Plasma Vault T4 neutralized debt round trip

on:
  push:
    branches:
      - audit/plasma-smart-lending-execution-20260806
    paths:
      - 'test/security/PlasmaVaultT4DebtRoundTripNeutralized.t.sol'
      - '.github/workflows/security-plasma-vault-t4-debt-roundtrip-neutralized.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neutralized-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
      PLASMA_FORK_BLOCK: 29082579
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated harness
        shell: bash
        run: |
          rm -rf audit/t4-debt-roundtrip-neutralized
          mkdir -p audit/t4-debt-roundtrip-neutralized/test audit/t4-debt-roundtrip-neutralized/lib evidence-plasma-vault-t4-debt-roundtrip-neutralized
          cp test/security/PlasmaVaultT4DebtRoundTripNeutralized.t.sol audit/t4-debt-roundtrip-neutralized/test/
          cp -R lib/forge-std audit/t4-debt-roundtrip-neutralized/lib/forge-std
      - name: Run neutralized debt round trip matrix
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/t4-debt-roundtrip-neutralized --via-ir \
            --match-path test/PlasmaVaultT4DebtRoundTripNeutralized.t.sol -vvvv 2>&1 \
            | tee evidence-plasma-vault-t4-debt-roundtrip-neutralized/roundtrip.log
      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E "(DebtRoundTripCycle|DebtRoundTripSummary)\(|Suite result|Failing tests|Error:|revert" \
            evidence-plasma-vault-t4-debt-roundtrip-neutralized/roundtrip.log \
            | tee evidence-plasma-vault-t4-debt-roundtrip-neutralized/summary.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-vault-t4-debt-roundtrip-neutralized
          path: evidence-plasma-vault-t4-debt-roundtrip-neutralized/
          if-no-files-found: error
          retention-days: 30
