name: Security fSL feeOrReward watch

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - '.github/workflows/security-fsl-fee-or-reward-watch.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Query all fSL feeOrReward values
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > /tmp/fsl-results.json
          rc=$?
          cat /tmp/fsl-results.json
          echo "checker_exit_code=$rc"
          # Preserve JSON in logs while keeping the workflow inspectable even when a non-zero rate is found.
          exit 0
      - name: Upload result JSON
        uses: actions/upload-artifact@v4
        with:
          name: fsl-fee-or-reward-results
          path: /tmp/fsl-results.json
          if-no-files-found: error
