name: Security Plasma API address recovery

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - '.github/workflows/security-plasma-api-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query and extract official Fluid Plasma endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-plasma-api
          query() {
            local name="$1" url="$2"
            echo "=== ${name}: ${url} ==="
            code="$(curl -L --silent --show-error --connect-timeout 10 --max-time 45 \
              -H 'accept: application/json' \
              -o "evidence-plasma-api/${name}.json" \
              -w '%{http_code}' "$url" || true)"
            bytes="$(wc -c < "evidence-plasma-api/${name}.json" 2>/dev/null || echo 0)"
            echo "http=${code:-CURL_ERROR} bytes=${bytes}"
            head -c 300 "evidence-plasma-api/${name}.json" 2>/dev/null || true
            echo
          }

          query dex_tickers https://api.fluid.instadapp.io/v2/9745/dexes/stats/tickers
          query dexes_v2 https://api.fluid.instadapp.io/v2/9745/dexes
          query vaults_v2 https://api.fluid.instadapp.io/v2/9745/vaults
          query dexes_v1 https://api.fluid.instadapp.io/9745/dexes
          query vaults_v1 https://api.fluid.instadapp.io/9745/vaults
          query dexes_chain_query 'https://api.fluid.instadapp.io/v2/dexes?chainId=9745'
          query vaults_chain_query 'https://api.fluid.instadapp.io/v2/vaults?chainId=9745'

          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('evidence-plasma-api')
          for p in sorted(root.glob('*.json')):
              print(f'=== EXTRACT {p.name} ===')
              raw = p.read_text(errors='replace')
              try:
                  obj = json.loads(raw)
              except Exception as exc:
                  print('not_json', exc, raw[:300])
                  continue
              def walk(x, path='$'):
                  if isinstance(x, dict):
                      text = json.dumps(x, sort_keys=True, separators=(',', ':'))
                      low = text.lower()
                      ids = ('id','dexId','dex_id','poolId','pool_id','vaultId','vault_id')
                      exact_id = any(str(x.get(k, '')) == '6' for k in ids)
                      target_pair = 'usdc' in low and ('usdt0' in low or 'usdt' in low or 'usd₮0' in low)
                      target_type = str(x.get('vaultType', x.get('vault_type', ''))) == '4'
                      if exact_id or target_pair or target_type:
                          print(path, text[:8000])
                      for k,v in x.items(): walk(v, f'{path}.{k}')
                  elif isinstance(x, list):
                      for i,v in enumerate(x): walk(v, f'{path}[{i}]')
              walk(obj)
              print('ALL_ADDRESSES')
              for addr in sorted(set(re.findall(r'0x[a-fA-F0-9]{40}', raw))):
                  print(addr)
          PY
