name: Security Plasma Vault T4 debt close cost

on:
  push:
    branches:
      - audit/plasma-smart-lending-execution-20260806
    paths:
      - 'test/security/PlasmaVaultT4DebtCloseCostInteraction.t.sol'
      - '.github/workflows/security-plasma-vault-t4-debt-close-cost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
      PLASMA_FORK_BLOCK: 29082579
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated harness
        shell: bash
        run: |
          rm -rf audit/t4-debt-close-cost
          mkdir -p audit/t4-debt-close-cost/test audit/t4-debt-close-cost/lib evidence-plasma-vault-t4-debt-close-cost
          cp test/security/PlasmaVaultT4DebtCloseCostInteraction.t.sol audit/t4-debt-close-cost/test/
          cp -R lib/forge-std audit/t4-debt-close-cost/lib/forge-std
      - name: Run debt close cost interaction probe
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/t4-debt-close-cost --via-ir \
            --match-path test/PlasmaVaultT4DebtCloseCostInteraction.t.sol -vvvv 2>&1 \
            | tee evidence-plasma-vault-t4-debt-close-cost/close-cost.log
      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E "(PositionMetadata|ShiftEconomics|CloseCostResult)\(|Suite result|Failing tests|Error:|revert" \
            evidence-plasma-vault-t4-debt-close-cost/close-cost.log \
            | tee evidence-plasma-vault-t4-debt-close-cost/summary.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-vault-t4-debt-close-cost
          path: evidence-plasma-vault-t4-debt-close-cost/
          if-no-files-found: error
          retention-days: 30
