name: fSL runtime 2026-08-23 0247
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fsl-runtime-20260823-0247.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check exact 21 canonical URLs
        run: |
          python - <<'PY'
          import json, requests
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          selector='0xe47a882d'
          targets=[
          ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
          ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c')]
          fallbacks={1:['https://ethereum-rpc.publicnode.com','https://rpc.ankr.com/eth'],8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']}
          def dec(v):
            n=int(v,16)&0xffffffff
            return n-(1<<32) if n&0x80000000 else n
          def one(t):
            net,cid,addr=t
            url=f'https://api.routescan.io/v2/network/mainnet/evm/{cid}/etherscan/api?action=eth_call&data={selector}&module=proxy&tag=latest&to={addr}'
            errs=[]
            try:
              r=requests.get(url,timeout=20,headers={'user-agent':'Mozilla/5.0'}); b=r.json(); v=b.get('result')
              if isinstance(v,str) and v.startswith('0x'):
                raw=dec(v); return {'network':net,'chain_id':cid,'address':addr,'source':'routescan','url':url,'result':v,'raw_int32':raw,'annual_percent':raw/10000}
              errs.append('routescan:'+repr(b))
            except Exception as e: errs.append('routescan:'+repr(e))
            payload={'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':addr,'data':selector},'latest']}
            for rpc in fallbacks[cid]:
              try:
                b=requests.post(rpc,json=payload,timeout=20).json(); v=b.get('result')
                if isinstance(v,str) and v.startswith('0x'):
                  raw=dec(v); return {'network':net,'chain_id':cid,'address':addr,'source':rpc,'url':url,'result':v,'raw_int32':raw,'annual_percent':raw/10000}
                errs.append(rpc+':'+repr(b))
              except Exception as e: errs.append(rpc+':'+repr(e))
            return {'network':net,'chain_id':cid,'address':addr,'url':url,'error':errs}
          rows=[]
          with ThreadPoolExecutor(max_workers=21) as ex:
            futs=[ex.submit(one,t) for t in targets]
            for f in as_completed(futs): rows.append(f.result())
          rows.sort(key=lambda x:(x['chain_id'],x['address'].lower()))
          fails=[x for x in rows if 'error' in x]; nz=[x for x in rows if x.get('raw_int32',0)!=0]
          out={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'target_count':21,'success_count':21-len(fails),'failure_count':len(fails),'nonzero':nz,'results':rows}
          print('FSL_JSON_BEGIN')
          print(json.dumps(out,separators=(',',':')))
          print('FSL_JSON_END')
          PY
