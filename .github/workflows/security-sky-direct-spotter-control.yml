name: Security Sky direct oracle causality control

on:
  push:
    branches:
      - audit/sky-ilk-registry-race-runner-20260806
    paths:
      - '.github/workflows/security-sky-direct-spotter-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Sky PoC branch
        uses: actions/checkout@v4
        with:
          repository: dimin4241-svg/dss-emergency-spells
          ref: audit/ilk-registry-readd-proof
          path: sky-poc
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run focused direct oracle causality control with RPC failover
        shell: bash
        working-directory: sky-poc
        run: |
          set -euo pipefail
          mkdir -p ../evidence-sky-direct-spotter-control
          endpoints=(
            'https://mainnet.gateway.tenderly.co'
            'https://ethereum-rpc.publicnode.com'
            'https://eth.drpc.org'
            'https://eth-mainnet.public.blastapi.io'
            'https://rpc.payload.de'
          )
          forge build 2>&1 | tee ../evidence-sky-direct-spotter-control/forge-build.log
          passed=0
          : > ../evidence-sky-direct-spotter-control/all-attempts.log
          for rpc in "${endpoints[@]}"; do
            safe=$(echo "$rpc" | tr '/:.' '_')
            log="../evidence-sky-direct-spotter-control/${safe}.log"
            set +e
            ETH_RPC_URL="$rpc" forge test --threads 1 \
              --match-path src/IlkRegistryDirectSpotterSingleControl.t.sol \
              --match-test testDirectPublicOracleAndSpotterPathMatchesRegistryOmegaResult \
              -vvvv > "$log" 2>&1
            rc=$?
            set -e
            {
              echo "=== rpc=$rpc rc=$rc ==="
              cat "$log"
            } | tee -a ../evidence-sky-direct-spotter-control/all-attempts.log
            if [[ $rc -eq 0 ]] && grep -q '\[PASS\]' "$log"; then
              cp "$log" ../evidence-sky-direct-spotter-control/forge-test.log
              echo "CASE_PASS direct-oracle-causality-control rpc=$rpc" | tee ../evidence-sky-direct-spotter-control/summary.log
              passed=1
              break
            fi
            sleep 2
          done
          [[ $passed -eq 1 ]]
          grep -E '(LINK-A baseline|direct oracle plus Spotter result|Registry plus Omega result|final values equal|PASS|Suite result)' \
            ../evidence-sky-direct-spotter-control/forge-test.log \
            | tee ../evidence-sky-direct-spotter-control/key-results.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-direct-spotter-causality-control
          path: evidence-sky-direct-spotter-control/
          if-no-files-found: error
          retention-days: 30
