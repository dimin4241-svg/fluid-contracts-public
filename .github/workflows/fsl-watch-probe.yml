name: fSL feeOrReward probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fsl-watch-probe.yml'
      - '.github/fsl-watch-trigger/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe all 21 deployed fSL contracts
        shell: bash
        run: |
          cat > /tmp/fsl_probe.py <<'PY'
          import json, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          SELECTOR='0xe47a882d'
          TARGETS=[
          ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),
          ('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
          ('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
          ('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
          ('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),
          ('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),
          ('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
          ('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),
          ('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),
          ('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
          ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),
          ('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),
          ('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),
          ('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),
          ('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),
          ('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),
          ('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),
          ('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c'),
          ]
          FALLBACKS={
            1:['https://ethereum-rpc.publicnode.com','https://rpc.ankr.com/eth'],
            8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],
            137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],
            42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],
            9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com'],
          }
          def canonical(chain,address):
            return f'https://api.routescan.io/v2/network/mainnet/evm/{chain}/etherscan/api?action=eth_call&data={SELECTOR}&module=proxy&tag=latest&to={address}'
          def get_json(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 fSL-watch'})
            with urllib.request.urlopen(req,timeout=30) as r:
              return json.loads(r.read().decode())
          def rpc_call(url,address):
            payload=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':address,'data':SELECTOR},'latest']}).encode()
            req=urllib.request.Request(url,data=payload,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 fSL-watch'})
            with urllib.request.urlopen(req,timeout=30) as r:
              return json.loads(r.read().decode())
          def decode32(result):
            v=int(result,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          checked=datetime.now(timezone.utc).isoformat()
          results=[]; failures=[]
          for network,chain,address in TARGETS:
            url=canonical(chain,address)
            result=None; source=None; primary_error=None
            try:
              body=get_json(url)
              cand=body.get('result')
              if not isinstance(cand,str) or not cand.startswith('0x'):
                raise RuntimeError(f'bad Routescan payload: {body}')
              result=cand; source='routescan'
            except Exception as e:
              primary_error=repr(e)
              for rpc in FALLBACKS.get(chain,[]):
                try:
                  body=rpc_call(rpc,address)
                  cand=body.get('result')
                  if not isinstance(cand,str) or not cand.startswith('0x'):
                    raise RuntimeError(f'bad RPC payload: {body}')
                  result=cand; source=rpc; break
                except Exception:
                  pass
            if result is None:
              failures.append({'network':network,'chain_id':chain,'address':address,'url':url,'routescan_error':primary_error})
              continue
            raw=decode32(result)
            row={'network':network,'chain_id':chain,'address':address,'url':url,'source':source,'result':result,'raw_int32':raw,'annual_percent':raw/10000,'checked_at_utc':checked}
            results.append(row)
          report={'checked_at_utc':checked,'target_count':len(TARGETS),'success_count':len(results),'failure_count':len(failures),'nonzero':[r for r in results if r['raw_int32']!=0],'results':results,'failures':failures}
          print('FSL_REPORT_BEGIN')
          print(json.dumps(report,indent=2))
          print('FSL_REPORT_END')
          open('fsl-report.json','w').write(json.dumps(report,indent=2))
          PY
          python /tmp/fsl_probe.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsl-report
          path: fsl-report.json
          if-no-files-found: ignore
