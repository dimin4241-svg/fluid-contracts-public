name: fSL feeOrReward check 2026-08-08 18:52 UTC

on:
  push:
    paths:
      - '.github/workflows/fsl-fee-watch-20260808-0853.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check all 21 fSL contracts
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > fsl-result.json
          rc=$?
          cat fsl-result.json
          echo "checker_exit_code=$rc"
          exit 0
