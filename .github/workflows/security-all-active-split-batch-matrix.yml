name: Security exhaustive split-batch DEX matrix

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - 'scripts/security/generate_all_active_split_batch_test.py'
      - '.github/workflows/security-all-active-split-batch-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split-batch-search:
    name: ${{ matrix.network }} split batch
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: mainnet
            rpc: https://ethereum-rpc.publicnode.com
          - network: arbitrum
            rpc: https://arbitrum-one-rpc.publicnode.com
          - network: base
            rpc: https://base-rpc.publicnode.com
          - network: polygon
            rpc: https://polygon-bor-rpc.publicnode.com
          - network: bnb
            rpc: https://bsc-rpc.publicnode.com
          - network: plasma
            rpc: https://rpc.plasma.to
    env:
      NETWORK: ${{ matrix.network }}
      RPC_URL: ${{ matrix.rpc }}
    steps:
      - name: Checkout audit branch with test dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install metadata dependencies
        run: python -m pip install 'web3>=7,<8'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Generate split-batch latest-state matrix
        shell: bash
        run: |
          mkdir -p audit/fork-poc/test evidence-split/${NETWORK}
          python scripts/security/generate_all_active_split_batch_test.py \
            --network "${NETWORK}" \
            --rpc "${RPC_URL}" \
            --solidity-out audit/fork-poc/test/GeneratedAllActiveSplitBatchSearch.t.sol \
            --metadata-out evidence-split/${NETWORK}/active-pools.json \
            | tee evidence-split/${NETWORK}/generation-summary.txt

      - name: Run split-forward single-reverse amplification search
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --root audit/fork-poc \
            --via-ir \
            --match-path test/GeneratedAllActiveSplitBatchSearch.t.sol \
            -vvvv 2>&1 | tee evidence-split/${NETWORK}/split-batch-fork.log

      - name: Extract split-batch summaries
        if: always()
        shell: bash
        run: |
          mkdir -p evidence-split/${NETWORK}
          grep -E "SplitBatchBest\(|SplitBatchNoProfit\(|SplitBatchSetupFailure\(|SplitBatchNetworkSummary\(|GENERATED_SPLIT_BATCH|Suite result|Failing tests|Compiler run failed|Error:" \
            evidence-split/${NETWORK}/split-batch-fork.log \
            evidence-split/${NETWORK}/generation-summary.txt \
            2>/dev/null | tee evidence-split/${NETWORK}/split-batch-summary.txt || true

      - name: Upload split-batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-split-batch-${{ matrix.network }}
          path: evidence-split/${{ matrix.network }}/
          if-no-files-found: warn
          retention-days: 30
