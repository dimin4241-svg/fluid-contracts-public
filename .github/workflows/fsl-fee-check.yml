name: fSL feeOrReward check

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - '.github/workflows/fsl-fee-check.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fsl-fee-check.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Run exhaustive on-chain check
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > artifacts/fsl-fee-check-latest.json
          code=$?
          echo "$code" > artifacts/fsl-fee-check-exit-code.txt
          cat artifacts/fsl-fee-check-latest.json
          echo "checker_exit=$code"
          exit 0
      - name: Commit result
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/fsl-fee-check-latest.json artifacts/fsl-fee-check-exit-code.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record latest fSL feeOrReward check'
          git push origin HEAD:audit/read-only-dex-fees-20260805
