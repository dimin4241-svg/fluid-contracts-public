name: Security composite DEX route fork search

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - name: Checkout with test dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare latest-state bounded search harness
        shell: bash
        run: |
          mkdir -p audit/fork-poc/src audit/fork-poc/test
          cp test/security/LowFeeCompositeRoutes.t.sol audit/fork-poc/test/LowFeeCompositeRoutes.t.sol
          python3 - <<'PY'
          from pathlib import Path
          p = Path('audit/fork-poc/test/LowFeeCompositeRoutes.t.sol')
          s = p.read_text()
          s = s.replace('vm.createSelectFork(vm.envString("MAINNET_RPC_URL"), FORK_BLOCK);', 'vm.createSelectFork(vm.envString("MAINNET_RPC_URL"));')
          s = s.replace('amount <= 5_000', 'amount <= 750')
          s = s.replace('i < 9', 'i < 7')
          p.write_text(s)
          PY
      - name: Run stateful mixed/cross-pool search
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --root audit/fork-poc \
            --match-path test/LowFeeCompositeRoutes.t.sol \
            --match-test test_searchMixedAndCrossPoolRoutes \
            -vvvv 2>&1 | tee composite-routes-fork.log
      - name: Upload search log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composite-routes-fork-log
          path: composite-routes-fork.log
          if-no-files-found: warn
