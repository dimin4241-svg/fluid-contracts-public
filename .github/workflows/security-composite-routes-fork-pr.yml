name: Security composite DEX route fork search

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - name: Checkout with test dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare bounded search harness
        shell: bash
        run: |
          mkdir -p audit/fork-poc/src audit/fork-poc/test
          cp test/security/LowFeeCompositeRoutes.t.sol audit/fork-poc/test/LowFeeCompositeRoutes.t.sol
          # PublicNode now rejects historical reads without an archive token.
          # Search on latest state; emitted results remain tied to the run time.
          sed -i 's/vm.createSelectFork(vm.envString("MAINNET_RPC_URL"), FORK_BLOCK);/vm.createSelectFork(vm.envString("MAINNET_RPC_URL"));/' audit/fork-poc/test/LowFeeCompositeRoutes.t.sol
      - name: Run independent mixed and cross-pool searches
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --root audit/fork-poc \
            --match-path test/LowFeeCompositeRoutes.t.sol \
            -vvvv 2>&1 | tee composite-routes-fork.log
      - name: Extract route summaries
        if: always()
        shell: bash
        run: |
          grep -E "RouteBest\(|Suite result|Ran [0-9]+ test|Failing tests" composite-routes-fork.log \
            | tee composite-routes-summary.log || true
      - name: Upload search logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composite-routes-fork-log
          path: |
            composite-routes-fork.log
            composite-routes-summary.log
          if-no-files-found: warn
