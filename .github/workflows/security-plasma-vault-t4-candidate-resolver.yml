name: Security Plasma Vault T4 candidate resolver

"on":
  push:
    branches:
      - audit/plasma-t4-exact-debt-controls-20260806
    paths:
      - 'test/security/PlasmaVaultT4CandidateResolver.t.sol'
      - '.github/workflows/security-plasma-vault-t4-candidate-resolver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLASMA_RPC_URL: "https://rpc.plasma.to"
      PLASMA_FORK_BLOCK: "29082579"
      CLAIMED_VAULT: "0x6E0Cdb5c21B3c8E340E9C9210057035bAfA86ffF"
      CLAIMED_DEX: "0xbd5dD095d9a6565C8222bb36B5814953F1C46f71"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated resolver
        shell: bash
        run: |
          rm -rf audit/t4-candidate-resolver
          mkdir -p audit/t4-candidate-resolver/test audit/t4-candidate-resolver/lib evidence-plasma-vault-t4-candidate-resolver
          cp test/security/PlasmaVaultT4CandidateResolver.t.sol audit/t4-candidate-resolver/test/
          cp -R lib/forge-std audit/t4-candidate-resolver/lib/forge-std
      - name: Resolve candidate vault and constants
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/t4-candidate-resolver --via-ir \
            --match-path test/PlasmaVaultT4CandidateResolver.t.sol -vvvv 2>&1 \
            | tee evidence-plasma-vault-t4-candidate-resolver/resolver.log
      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E "(FactoryState|CandidateResolved|ResolvedConstants|TokenMetadata|ResolvedComparison)\(|Suite result|Failing tests|Error:|revert" \
            evidence-plasma-vault-t4-candidate-resolver/resolver.log \
            | tee evidence-plasma-vault-t4-candidate-resolver/summary.log || true
          printf '%s\n' "$PLASMA_FORK_BLOCK" > evidence-plasma-vault-t4-candidate-resolver/block.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-vault-t4-candidate-resolver
          path: evidence-plasma-vault-t4-candidate-resolver/
          if-no-files-found: error
          retention-days: 30
