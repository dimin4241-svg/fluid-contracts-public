name: fSL feeOrReward watch

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - '.github/workflows/fsl_fee_watch.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - name: Ensure requests
        run: python3 -m pip install --user requests
      - name: Check all fSL feeOrReward values
        shell: bash
        run: |
          set +e
          python3 scripts/security/check_fsl_fee_or_reward.py | tee fsl_fee_check.json
          code=${PIPESTATUS[0]}
          echo "checker_exit=$code"
          exit 0
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fsl-fee-check
          path: fsl_fee_check.json
