          FALLBACK={1:['https://ethereum-rpc.publicnode.com','https://eth-mainnet.g.alchemy.com/public'],8453:['https://mainnet.base.org','https://base-rpc.publicnode.com'],137:['https://polygon.drpc.org','https://polygon-bor-rpc.publicnode.com'],42161:['https://arb1.arbitrum.io/rpc','https://arbitrum-one-rpc.publicnode.com'],9745:['https://rpc.plasma.to','https://9745.rpc.thirdweb.com']}
          def dec32(x):
            v=int(x,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def get_route(t):
            n,c,a,u=t
            errs=[]
            for i in range(3):
              try:
                r=requests.get(u,timeout=25,headers={'User-Agent':'fsl-watch/2026-08-18'}); r.raise_for_status(); j=r.json(); x=j.get('result')
                if isinstance(x,str) and x.startswith('0x'): return {'network':n,'chain_id':c,'address':a,'url':u,'result':x,'source':'routescan'}
                errs.append(f'bad payload {j}')
              except Exception as e: errs.append(repr(e))
              time.sleep(1+i)
            return {'network':n,'chain_id':c,'address':a,'url':u,'errors':errs}
          def rpc_call(rpc,address):
            p={'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':address,'data':SELECTOR},'latest']}
            r=requests.post(rpc,json=p,timeout=25,headers={'User-Agent':'fsl-watch/2026-08-18'}); r.raise_for_status(); j=r.json(); x=j.get('result')
            if not (isinstance(x,str) and x.startswith('0x')): raise RuntimeError(f'bad payload {j}')
            return x
          with concurrent.futures.ThreadPoolExecutor(max_workers=21) as ex: rows=list(ex.map(get_route,TARGETS))
          failures=[]
          for row in rows:
            if 'result' not in row:
              errs=row.get('errors',[])
              for rpc in FALLBACK.get(row['chain_id'],[]):
                try: row['result']=rpc_call(rpc,row['address']); row['source']=rpc; break
                except Exception as e: errs.append(f'{rpc}: {e!r}')
              row['errors']=errs
            if 'result' not in row: failures.append(row); continue
            row['raw_int32']=dec32(row['result']); row['annual_percent']=row['raw_int32']/10000
            if row['raw_int32']!=0:
              conf=[]
              for rpc in FALLBACK.get(row['chain_id'],[]):
                try:
                  x=rpc_call(rpc,row['address']); conf.append({'rpc':rpc,'result':x,'raw_int32':dec32(x),'match':x.lower()==row['result'].lower()})
                except Exception as e: conf.append({'rpc':rpc,'error':repr(e)})
              row['independent_confirmations']=conf
          out={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'target_count':len(TARGETS),'success_count':sum('result' in r for r in rows),'failure_count':len(failures),'nonzero':[r for r in rows if r.get('raw_int32',0)!=0],'results':rows,'failures':failures}
