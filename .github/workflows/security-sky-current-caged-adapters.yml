name: Security Sky current adapter simulation

on:
  push:
    branches:
      - audit/sky-ilk-registry-race-runner-20260806
    paths:
      - '.github/workflows/security-sky-current-caged-adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout complete Sky spell archive
        uses: actions/checkout@v4
        with:
          repository: sky-ecosystem/spells-mainnet
          ref: master
          path: spells-mainnet
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Select stable Ethereum RPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-current-adapter-simulation
          endpoints=(
            'https://eth-mainnet.public.blastapi.io'
            'https://mainnet.gateway.tenderly.co'
            'https://ethereum-rpc.publicnode.com'
            'https://eth.drpc.org'
            'https://rpc.payload.de'
          )
          for rpc in "${endpoints[@]}"; do
            if output=$(timeout 25 cast call 0x5a464C28D19848f44199D003BeF5ecc87d090F87 'count()(uint256)' --rpc-url "$rpc" 2>&1) && [[ "$output" =~ ^[0-9]+ ]]; then
              echo "ETH_RPC_URL=$rpc" >> "$GITHUB_ENV"
              echo "selected=$rpc count=$output" | tee evidence-current-adapter-simulation/rpc.log
              exit 0
            fi
          done
          exit 1

      - name: Extract historical Join addresses
        shell: bash
        run: |
          python3 - <<'PY' > evidence-current-adapter-simulation/addresses.txt
          from pathlib import Path
          import re
          addrs = set()
          patterns = [
              re.compile(r'address(?:\s+(?:public|internal|private))?\s+constant\s+[A-Z0-9_]*JOIN[A-Z0-9_]*\s*=\s*(0x[0-9a-fA-F]{40})'),
              re.compile(r'[A-Z0-9_]*JOIN[A-Z0-9_]*\s*=\s*(0x[0-9a-fA-F]{40})'),
          ]
          for p in Path('spells-mainnet').rglob('*.sol'):
              text = p.read_text(errors='ignore')
              for pattern in patterns:
                  addrs.update(a.lower() for a in pattern.findall(text))
          for addr in sorted(a for a in addrs if a != '0x0000000000000000000000000000000000000000'):
              print(addr)
          PY
          echo "historical_addresses=$(wc -l < evidence-current-adapter-simulation/addresses.txt)" | tee -a evidence-current-adapter-simulation/rpc.log

      - name: Simulate production add for every historical Join
        shell: bash
        run: |
          set -euo pipefail
          REG=0x5a464C28D19848f44199D003BeF5ecc87d090F87
          VAT=0x35D1b3F3D7966A1DFe207aa4514C12a259A0492B
          ATTACKER=0x000000000000000000000000000000000000bEEF
          ZERO=0x0000000000000000000000000000000000000000

          echo 'adapter,ilk,live,vat_ward,registry_join,art,line,simulation,gas_or_revert' > evidence-current-adapter-simulation/state.csv
          : > evidence-current-adapter-simulation/addable.txt
          : > evidence-current-adapter-simulation/caged-addable.txt
          : > evidence-current-adapter-simulation/nonzero-art-or-line-addable.txt

          while read -r adapter; do
            vat=$(timeout 20 cast call "$adapter" 'vat()(address)' --rpc-url "$ETH_RPC_URL" 2>/dev/null || true)
            [[ "${vat,,}" == "${VAT,,}" ]] || continue

            ilk=$(timeout 20 cast call "$adapter" 'ilk()(bytes32)' --rpc-url "$ETH_RPC_URL" 2>/dev/null || true)
            [[ "$ilk" =~ ^0x[0-9a-fA-F]{64}$ ]] || continue

            live=$(timeout 20 cast call "$adapter" 'live()(uint256)' --rpc-url "$ETH_RPC_URL" 2>/dev/null | awk '{print $1}' || true)
            ward=$(timeout 20 cast call "$VAT" 'wards(address)(uint256)' "$adapter" --rpc-url "$ETH_RPC_URL" 2>/dev/null | awk '{print $1}' || true)
            regjoin=$(timeout 20 cast call "$REG" 'join(bytes32)(address)' "$ilk" --rpc-url "$ETH_RPC_URL" 2>/dev/null || true)
            values=$(timeout 20 cast call "$VAT" 'ilks(bytes32)(uint256,uint256,uint256,uint256,uint256)' "$ilk" --rpc-url "$ETH_RPC_URL" 2>/dev/null | awk '{print $1}' | xargs || true)
            read -r art _ _ line _ <<< "$values"
            art=${art:-?}
            line=${line:-?}

            simulation=REVERT
            detail=''
            if detail=$(timeout 35 cast estimate "$REG" 'add(address)' "$adapter" --from "$ATTACKER" --rpc-url "$ETH_RPC_URL" 2>&1); then
              simulation=SUCCESS
              detail=$(echo "$detail" | tr '\n' ' ' | sed 's/,/;/g')
              echo "$adapter $ilk live=${live:-?} art=$art line=$line estimated_gas=$detail" >> evidence-current-adapter-simulation/addable.txt
              if [[ "$live" == 0 ]]; then
                echo "$adapter $ilk art=$art line=$line estimated_gas=$detail" >> evidence-current-adapter-simulation/caged-addable.txt
              fi
              if [[ "$art" != 0 || "$line" != 0 ]]; then
                echo "$adapter $ilk live=${live:-?} art=$art line=$line estimated_gas=$detail" >> evidence-current-adapter-simulation/nonzero-art-or-line-addable.txt
              fi
            else
              detail=$(echo "$detail" | tr '\n' ' ' | sed 's/,/;/g' | cut -c1-300)
            fi

            echo "$adapter,$ilk,${live:-?},${ward:-?},${regjoin:-?},$art,$line,$simulation,$detail" >> evidence-current-adapter-simulation/state.csv
          done < evidence-current-adapter-simulation/addresses.txt

          {
            echo "production_registry_count=$(cast call "$REG" 'count()(uint256)' --rpc-url "$ETH_RPC_URL")"
            echo "simulated_add_success_count=$(wc -l < evidence-current-adapter-simulation/addable.txt)"
            echo "simulated_caged_add_success_count=$(wc -l < evidence-current-adapter-simulation/caged-addable.txt)"
            echo "simulated_nonzero_art_or_line_success_count=$(wc -l < evidence-current-adapter-simulation/nonzero-art-or-line-addable.txt)"
            echo '--- successful production add simulations ---'
            cat evidence-current-adapter-simulation/addable.txt
            echo '--- successful caged adapter simulations ---'
            cat evidence-current-adapter-simulation/caged-addable.txt
            echo '--- successful nonzero Art/line simulations ---'
            cat evidence-current-adapter-simulation/nonzero-art-or-line-addable.txt
          } | tee evidence-current-adapter-simulation/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-current-adapter-simulation
          path: evidence-current-adapter-simulation/
          if-no-files-found: error
          retention-days: 30
