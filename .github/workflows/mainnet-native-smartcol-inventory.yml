name: Mainnet native SmartCol ordering inventory

on:
  push:
    branches: [audit/absorb-gas-dos]
    paths:
      - 'scripts/security/inventory_mainnet_native_smartcol.py'
      - '.github/workflows/mainnet-native-smartcol-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/absorb-gas-dos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests eth-utils 'eth-hash[pycryptodome]'
      - name: Query live mainnet state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation
          python -u scripts/security/inventory_mainnet_native_smartcol.py | tee automation/mainnet-native-smartcol.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mainnet-native-smartcol-inventory
          path: automation/mainnet-native-smartcol.json
