name: fSL feeOrReward check 2026-08-20T01:50Z

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - .github/workflows/fsl-check-20260820-0049.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - name: Check all 21 canonical Routescan URLs
        shell: bash
        run: |
          python3 -m pip install --quiet requests
          mkdir -p automation-results
          set +e
          python3 scripts/security/check_fsl_fee_or_reward.py > automation-results/fsl-20260820-0150.json
          rc=$?
          set -e
          cat automation-results/fsl-20260820-0150.json
          echo "checker_exit_code=$rc"
      - name: Commit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation-results/fsl-20260820-0150.json
          git commit -m 'Store fSL check result 2026-08-20T01:50Z' || exit 0
          git push
