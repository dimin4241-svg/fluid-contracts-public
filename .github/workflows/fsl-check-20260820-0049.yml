name: fSL feeOrReward check 2026-08-19T19:49Z

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - .github/workflows/fsl-check-20260820-0049.yml

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check all 21 canonical Routescan URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, time, datetime

          selector='0xe47a882d'
          targets=[
          ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
          ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c')]
          fallbacks={
            1:['https://ethereum-rpc.publicnode.com','https://cloudflare-eth.com'],
            8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],
            137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],
            42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],
            9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']}

          def raw32(x):
            v=int(x,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=25) as r:return json.loads(r.read().decode())
          def post(url,address):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':address,'data':selector},'latest']}).encode()
            req=urllib.request.Request(url,data=body,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=25) as r:return json.loads(r.read().decode())

          rows=[]
          for network,cid,address in targets:
            url=f'https://api.routescan.io/v2/network/mainnet/evm/{cid}/etherscan/api?action=eth_call&data={selector}&module=proxy&tag=latest&to={address}'
            rec={'network':network,'chain_id':cid,'address':address,'url':url}
            try:
              j=get(url); result=j.get('result')
              if not isinstance(result,str) or not result.startswith('0x'):raise RuntimeError(repr(j))
              rec.update(source='routescan',result=result,raw=raw32(result),annual_percent=raw32(result)/10000)
            except Exception as e:
              rec['routescan_error']=repr(e)
              for rpc in fallbacks[cid]:
                try:
                  j=post(rpc,address); result=j.get('result')
                  if not isinstance(result,str) or not result.startswith('0x'):raise RuntimeError(repr(j))
                  rec.update(source=rpc,result=result,raw=raw32(result),annual_percent=raw32(result)/10000); break
                except Exception as ee:rec.setdefault('fallback_errors',[]).append(f'{rpc}: {ee!r}')
              if 'raw' not in rec:rec['unconfirmed']=True
            print('FSL_RESULT '+json.dumps(rec,sort_keys=True))
            rows.append(rec)

          nz=[r for r in rows if r.get('raw',0)!=0]
          un=[r for r in rows if r.get('unconfirmed')]
          print('FSL_SUMMARY '+json.dumps({'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'total':len(rows),'confirmed':sum('raw' in r for r in rows),'unconfirmed':len(un),'nonzero':nz},sort_keys=True))
          if un: raise SystemExit(2)
          if nz: raise SystemExit(10)
          PY
