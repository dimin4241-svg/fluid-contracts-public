name: Security Plasma Vault T4 position resolver probe

on:
  push:
    branches:
      - audit/plasma-smart-lending-execution-20260806
    paths:
      - 'test/security/PlasmaVaultT4PositionResolverProbe.t.sol'
      - '.github/workflows/security-plasma-vault-t4-position-resolver-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  position-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve fresh Plasma fork block
        shell: bash
        run: |
          echo "PLASMA_FORK_BLOCK=$(cast block-number --rpc-url "$PLASMA_RPC_URL")" >> "$GITHUB_ENV"

      - name: Prepare isolated resolver probe
        shell: bash
        run: |
          rm -rf audit/t4-position-resolver-poc
          mkdir -p audit/t4-position-resolver-poc/test audit/t4-position-resolver-poc/lib evidence-vault-t4-positions
          cp test/security/PlasmaVaultT4PositionResolverProbe.t.sol audit/t4-position-resolver-poc/test/
          cp -R lib/forge-std audit/t4-position-resolver-poc/lib/forge-std

      - name: Decode active T4 positions
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --root audit/t4-position-resolver-poc \
            --via-ir \
            --match-path test/PlasmaVaultT4PositionResolverProbe.t.sol \
            -vvvv 2>&1 | tee evidence-vault-t4-positions/positions.log

      - name: Extract summary
        if: always()
        shell: bash
        run: |
          grep -E "(PositionDecoded|PositionSummary)\(|Suite result|Failing tests|Error:" \
            evidence-vault-t4-positions/positions.log \
            | tee evidence-vault-t4-positions/positions-summary.log || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-vault-t4-position-resolver-probe
          path: evidence-vault-t4-positions/
          if-no-files-found: error
          retention-days: 30
