name: fSL feeOrReward bootstrap

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fsl-fee-watch-bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run exact 21 canonical Routescan calls with fallbacks
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py
          code=$?
          echo "checker_exit_code=$code"
          exit 0
      - name: Persist result on audit branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fsl_fee_or_reward_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record fSL feeOrReward check [skip ci]'
          git push origin HEAD:audit/read-only-dex-fees-20260805
