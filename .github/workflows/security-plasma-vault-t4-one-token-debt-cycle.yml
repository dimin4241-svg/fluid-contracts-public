name: Security Plasma Vault T4 one-token debt cycle

on:
  push:
    branches:
      - audit/plasma-smart-lending-execution-20260806
    paths:
      - 'test/security/PlasmaVaultT4OneTokenDebtCycle.t.sol'
      - '.github/workflows/security-plasma-vault-t4-one-token-debt-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
      PLASMA_FORK_BLOCK: 29082579
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated harness
        shell: bash
        run: |
          rm -rf audit/t4-one-token-cycle
          mkdir -p audit/t4-one-token-cycle/test audit/t4-one-token-cycle/lib evidence-plasma-vault-t4-one-token-cycle
          cp test/security/PlasmaVaultT4OneTokenDebtCycle.t.sol audit/t4-one-token-cycle/test/
          cp -R lib/forge-std audit/t4-one-token-cycle/lib/forge-std
      - name: Run one-token debt cycles
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/t4-one-token-cycle --via-ir \
            --match-path test/PlasmaVaultT4OneTokenDebtCycle.t.sol -vvvv 2>&1 \
            | tee evidence-plasma-vault-t4-one-token-cycle/cycles.log
      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E "CycleResult\(|Suite result|Failing tests|Error:|revert" \
            evidence-plasma-vault-t4-one-token-cycle/cycles.log \
            | tee evidence-plasma-vault-t4-one-token-cycle/summary.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-vault-t4-one-token-debt-cycle
          path: evidence-plasma-vault-t4-one-token-cycle/
          if-no-files-found: error
          retention-days: 30
