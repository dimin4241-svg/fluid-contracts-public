name: fSL feeOrReward one-shot check

on:
  push:
    branches: [audit/read-only-dex-fees-20260805]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check all fSL targets
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > fsl_results.json
          status=$?
          echo "checker_exit_code=$status"
          cat fsl_results.json
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-results
          path: fsl_results.json
          if-no-files-found: error
