name: fSL feeOrReward one-shot check

# Triggered for fresh verification: 2026-08-19T03:53:30Z
on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - '.github/workflows/fsl-fee-or-reward-check.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  pull_request:
    paths:
      - '.github/workflows/fsl-fee-or-reward-check.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Run exhaustive checker
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > scripts/security/fsl-latest-results.json
          code=$?
          echo "$code" > scripts/security/fsl-latest-exit-code.txt
          exit 0
      - name: Commit result snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/security/fsl-latest-results.json scripts/security/fsl-latest-exit-code.txt
          git commit -m 'Record fSL feeOrReward on-chain snapshot' || exit 0
          git push origin HEAD:audit/read-only-dex-fees-20260805
