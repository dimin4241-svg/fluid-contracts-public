name: fSL feeOrReward check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'automation/fsl-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Check all deployed fSL contracts
        shell: bash
        run: |
          set +e
          mkdir -p automation
          python scripts/security/check_fsl_fee_or_reward_fast.py > automation/fsl-result.json 2> automation/fsl-errors.txt
          code=$?
          echo "=== RESULTS ==="
          cat automation/fsl-result.json
          echo "=== STDERR ==="
          cat automation/fsl-errors.txt || true
          echo "checker_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Commit result for push runs
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/fsl-result.json automation/fsl-errors.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record fSL on-chain verification result'
          git push
      - name: Upload raw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsl-fee-or-reward-results
          path: |
            automation/fsl-result.json
            automation/fsl-errors.txt
          if-no-files-found: error
