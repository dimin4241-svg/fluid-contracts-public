name: fSL feeOrReward check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests
      - name: Check all deployed fSL contracts
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > fsl-result.json
          code=$?
          cat fsl-result.json
          echo "checker_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fsl-fee-or-reward-result
          path: fsl-result.json
          if-no-files-found: error
