name: fSL feeOrReward trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fsl-fee-watch-trigger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Run exhaustive on-chain check
        id: check
        continue-on-error: true
        run: |
          python scripts/security/check_fsl_fee_or_reward.py > fsl-results.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Print result
        if: always()
        run: cat fsl-results.json
      - name: Persist latest result on audit branch
        if: always()
        run: |
          mkdir -p .automation
          cp fsl-results.json .automation/fsl-fee-results.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .automation/fsl-fee-results.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh fSL fee check result [skip ci]"
            git push origin HEAD:audit/read-only-dex-fees-20260805
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsl-results
          path: fsl-results.json

