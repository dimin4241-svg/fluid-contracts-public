name: Security active DEX token metadata scan

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/security-all-active-pool-metadata-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'web3>=7,<8'
      - name: Enumerate every initialized active pool and token precision
        shell: bash
        run: |
          python - <<'PY' | tee active-pool-metadata.json
          import json
          from web3 import Web3
          import sys
          sys.path.insert(0, 'scripts/security')
          from inspect_zero_fee_pools import (
              RPC_BY_NETWORK, FACTORY_ABI, DEX_ABI, DEX_VARIABLES2_SLOT,
              FEE_MASK, factory_address, token_meta,
          )

          rows, errors = [], []
          for network, rpc in RPC_BY_NETWORK.items():
              try:
                  w3 = Web3(Web3.HTTPProvider(rpc, request_kwargs={'timeout': 45}))
                  if not w3.is_connected():
                      raise RuntimeError('RPC unavailable')
                  block = w3.eth.block_number
                  factory = w3.eth.contract(address=factory_address(network), abi=FACTORY_ABI)
                  total = int(factory.functions.totalDexes().call(block_identifier=block))
                  for dex_id in range(1, total + 1):
                      dex_address = Web3.to_checksum_address(factory.functions.getDexAddress(dex_id).call(block_identifier=block))
                      if not w3.eth.get_code(dex_address, block_identifier=block):
                          continue
                      dex = w3.eth.contract(address=dex_address, abi=DEX_ABI)
                      packed = int(dex.functions.readFromStorage(DEX_VARIABLES2_SLOT).call(block_identifier=block))
                      smart_collateral = bool(packed & 1)
                      smart_debt = bool(packed & 2)
                      paused = bool(packed >> 255)
                      if paused or not (smart_collateral or smart_debt):
                          continue
                      cv = dex.functions.constantsView().call(block_identifier=block)
                      cv2 = dex.functions.constantsView2().call(block_identifier=block)
                      token0 = Web3.to_checksum_address(cv[5])
                      token1 = Web3.to_checksum_address(cv[6])
                      rows.append({
                          'network': network,
                          'block': block,
                          'dex_id': dex_id,
                          'dex': dex_address,
                          'liquidity': cv[1],
                          'token0': token0,
                          'token1': token1,
                          'token0_meta': token_meta(w3, token0, block),
                          'token1_meta': token_meta(w3, token1, block),
                          'precision': {
                              't0_num': int(cv2[0]), 't0_den': int(cv2[1]),
                              't1_num': int(cv2[2]), 't1_den': int(cv2[3]),
                          },
                          'fee_raw': int((packed >> 2) & FEE_MASK),
                          'fee_percent': int((packed >> 2) & FEE_MASK) / 10_000,
                          'smart_collateral': smart_collateral,
                          'smart_debt': smart_debt,
                          'revenue_cut_percent': int((packed >> 19) & 0x7F),
                      })
              except Exception as exc:
                  errors.append({'network': network, 'error': str(exc)})
          print(json.dumps({'rows': rows, 'errors': errors}, indent=2, default=str))
          PY
      - name: Rank low-decimal and asymmetric-precision candidates
        shell: bash
        run: |
          python - <<'PY' | tee active-pool-candidates.txt
          import json
          d = json.load(open('active-pool-metadata.json'))
          rows = d['rows']
          def dec(meta):
              v = meta.get('decimals')
              return 99 if v is None else int(v)
          ranked = sorted(rows, key=lambda r: (
              min(dec(r['token0_meta']), dec(r['token1_meta'])),
              -abs(dec(r['token0_meta']) - dec(r['token1_meta'])),
              r['fee_raw'], r['network'], r['dex_id']))
          print(f"active_pools={len(rows)} errors={len(d['errors'])}")
          for r in ranked:
              d0, d1 = dec(r['token0_meta']), dec(r['token1_meta'])
              if min(d0, d1) <= 8 or abs(d0 - d1) >= 6 or r['fee_raw'] <= 50:
                  print(
                      f"{r['network']} dex={r['dex_id']} {r['dex']} "
                      f"{r['token0_meta'].get('symbol')}({d0})/"
                      f"{r['token1_meta'].get('symbol')}({d1}) "
                      f"fee={r['fee_raw']} collateral={r['smart_collateral']} debt={r['smart_debt']} "
                      f"precision={r['precision']}"
                  )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-pool-metadata
          path: |
            active-pool-metadata.json
            active-pool-candidates.txt
          retention-days: 30
