name: fSL feeOrReward canonical check 2026-08-18 1556

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - .github/workflows/fsl-fee-check-20260818-1556.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Check all 21 canonical Routescan URLs
        shell: bash
        run: |
          mkdir -p security-results
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > security-results/fsl-fee-check-20260818-1556.json
          code=$?
          echo "checker_exit_code=$code"
          cat security-results/fsl-fee-check-20260818-1556.json
          exit 0
      - name: Commit check result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add security-results/fsl-fee-check-20260818-1556.json
          git commit -m "Record fresh fSL feeOrReward check 2026-08-18 1556" || exit 0
          git push origin HEAD:audit/read-only-dex-fees-20260805
