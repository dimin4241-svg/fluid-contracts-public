name: Security inspect zero-fee pools

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check web3==7.13.0 eth-abi==5.2.0
      - name: Inspect zero-fee pools (eth_call only)
        shell: bash
        run: |
          set -o pipefail
          python scripts/security/inspect_zero_fee_pools.py > zero-fee-pools.json 2> zero-fee-pools-summary.txt
          cat zero-fee-pools-summary.txt
          cat zero-fee-pools.json
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-fee-pool-inspection
          path: |
            zero-fee-pools.json
            zero-fee-pools-summary.txt
          if-no-files-found: warn
