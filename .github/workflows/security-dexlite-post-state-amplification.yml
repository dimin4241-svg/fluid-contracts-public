name: Security DexLite post-cycle state amplification

on:
  push:
    branches:
      - audit/cross-module-high-critical-20260805
    paths:
      - 'test/security/DexLitePostCycleStateAmplification.t.sol'
      - '.github/workflows/security-dexlite-post-state-amplification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAINNET_RPC_URL: 'https://ethereum-rpc.publicnode.com'
    steps:
      - name: Checkout with dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve fresh Ethereum block
        shell: bash
        run: |
          MAINNET_FORK_BLOCK="$(cast block-number --rpc-url "$MAINNET_RPC_URL")"
          echo "MAINNET_FORK_BLOCK=$MAINNET_FORK_BLOCK" >> "$GITHUB_ENV"
          echo "Fork block: $MAINNET_FORK_BLOCK"

      - name: Prepare isolated harness
        shell: bash
        run: |
          mkdir -p audit/dexlite-post-state/test audit/dexlite-post-state/src audit/dexlite-post-state/lib evidence-dexlite-post-state
          cp test/security/DexLitePostCycleStateAmplification.t.sol audit/dexlite-post-state/test/
          ln -s "$GITHUB_WORKSPACE/lib/forge-std" audit/dexlite-post-state/lib/forge-std
          cat > audit/dexlite-post-state/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          solc_version = "0.8.29"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          gas_limit = "18446744073709551615"
          EOF

      - name: Run post-cycle state probe
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --root audit/dexlite-post-state \
            --match-path test/DexLitePostCycleStateAmplification.t.sol \
            -vvvv 2>&1 | tee evidence-dexlite-post-state/post-state.log

      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E "(LongCycleRound|QuoteComparison|StateSummary|Suite result|Failing tests|Error:)" \
            evidence-dexlite-post-state/post-state.log \
            | tee evidence-dexlite-post-state/post-state-summary.log || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dexlite-post-cycle-state-amplification
          path: evidence-dexlite-post-state/
          if-no-files-found: error
          retention-days: 30
