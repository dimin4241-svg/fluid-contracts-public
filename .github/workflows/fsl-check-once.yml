name: fSL feeOrReward check once

on:
  push:
    paths:
      - '.github/workflows/fsl-check-once.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all 21 canonical Routescan URLs
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, time, datetime, pathlib
          targets = [
          ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
          ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c')]
          def dec(h):
              x=int(h,16)&0xffffffff
              return x-(1<<32) if x&0x80000000 else x
          rows=[]
          for i,(net,cid,addr) in enumerate(targets,1):
              url=f'https://api.routescan.io/v2/network/mainnet/evm/{cid}/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to={addr}'
              row={'i':i,'network':net,'chain_id':cid,'address':addr,'url':url}
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=30) as r: body=r.read().decode()
                      j=json.loads(body); result=j.get('result')
                      if isinstance(result,str) and result.startswith('0x'):
                          raw=dec(result); row.update(result=result,raw=raw,annual_percent=raw/10000); last=None; break
                      last=f'bad payload {body}'
                  except Exception as e: last=repr(e)
                  time.sleep(2)
              if last: row['error']=last
              rows.append(row); time.sleep(0.6)
          payload={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'count':len(rows),'nonzero':[r for r in rows if r.get('raw',0)!=0],'errors':[r for r in rows if 'error' in r],'results':rows}
          pathlib.Path('.automation').mkdir(exist_ok=True)
          pathlib.Path('.automation/fsl-latest.json').write_text(json.dumps(payload,indent=2))
          print(json.dumps(payload))
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .automation/fsl-latest.json
          git commit -m 'Update fSL feeOrReward probe result' || exit 0
          git push
# trigger 2026-08-27T00:48:00Z
