              x=int(h,16)&0xffffffff
              return x-(1<<32) if x&0x80000000 else x
          out=[]
          for i,(net,cid,addr,url) in enumerate(urls,1):
              err=None; body=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=30) as r: body=r.read().decode()
                      j=json.loads(body); result=j.get('result')
                      if isinstance(result,str) and result.startswith('0x'):
                          raw=dec32(result)
                          row={'i':i,'network':net,'chain_id':cid,'address':addr,'result':result,'raw':raw,'annual_percent':raw/10000}
                          print(json.dumps(row), flush=True); out.append(row); err=None; break
                      err=f'bad payload {body}'
                  except Exception as e: err=repr(e)
                  time.sleep(1+attempt)
              if err:
                  print(json.dumps({'i':i,'network':net,'chain_id':cid,'address':addr,'ERROR':err}), flush=True)
                  out.append({'i':i,'network':net,'chain_id':cid,'address':addr,'ERROR':err})
              time.sleep(0.6)
          print('SUMMARY '+json.dumps({'count':len(out),'nonzero':[r for r in out if r.get('raw',0)!=0],'errors':[r for r in out if 'ERROR' in r]}), flush=True)
