            ('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f','https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),
            ('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6','https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),
            ('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70','https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),
            ('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c','https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c'),
          ]
          fallbacks={1:['https://ethereum-rpc.publicnode.com','https://rpc.ankr.com/eth'],8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']}
          def dec(x):
            n=int(x,16)&0xffffffff
            return n-(1<<32) if n&0x80000000 else n
          def one(t):
            net,cid,addr,url=t; errors=[]
            try:
              r=requests.get(url,timeout=30,headers={'User-Agent':'fsl-watch-live/1.0'})
              body=r.json(); result=body.get('result')
              if isinstance(result,str) and result.startswith('0x'):
                raw=dec(result)
                return {'network':net,'chain_id':cid,'address':addr,'canonical_url':url,'source':'routescan','http_status':r.status_code,'result':result,'raw_int32':raw,'annual_percent':raw/10000}
              errors.append({'source':'routescan','status':r.status_code,'body':body})
            except Exception as e: errors.append({'source':'routescan','error':repr(e)})
            payload={'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':addr,'data':selector},'latest']}
            for rpc in fallbacks[cid]:
              try:
                r=requests.post(rpc,json=payload,timeout=30); body=r.json(); result=body.get('result')
                if isinstance(result,str) and result.startswith('0x'):
                  raw=dec(result)
                  return {'network':net,'chain_id':cid,'address':addr,'canonical_url':url,'source':rpc,'http_status':r.status_code,'result':result,'raw_int32':raw,'annual_percent':raw/10000,'routescan_errors':errors}
                errors.append({'source':rpc,'status':r.status_code,'body':body})
              except Exception as e: errors.append({'source':rpc,'error':repr(e)})
            return {'network':net,'chain_id':cid,'address':addr,'canonical_url':url,'errors':errors}
          rows=[]
          with ThreadPoolExecutor(max_workers=21) as ex:
            futs=[ex.submit(one,t) for t in targets]
            for f in as_completed(futs): rows.append(f.result())
          rows.sort(key=lambda x:(x['chain_id'],x['address'].lower()))
          failures=[x for x in rows if 'errors' in x]
          nonzero=[x for x in rows if x.get('raw_int32',0)!=0]
          out={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'target_count':21,'success_count':21-len(failures),'failure_count':len(failures),'nonzero':nonzero,'results':rows}
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-live-result
          path: fsl-live-result.json
          retention-days: 1
