name: Security DexFee current keeper bypass V2

on:
  push:
    branches:
      - audit/cross-module-high-critical-20260805
    paths:
      - 'test/security/DexFeeCurrentKeeperBypassV2.t.sol'
      - '.github/workflows/security-dex-fee-current-keeper-bypass-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAINNET_RPC_URL: 'https://ethereum-rpc.publicnode.com'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Resolve fork block
        shell: bash
        run: echo "MAINNET_FORK_BLOCK=$(cast block-number --rpc-url "$MAINNET_RPC_URL")" >> "$GITHUB_ENV"
      - name: Prepare harness
        shell: bash
        run: |
          mkdir -p audit/dex-fee-current-v2/test audit/dex-fee-current-v2/src audit/dex-fee-current-v2/lib evidence-dex-fee-current-v2
          cp test/security/DexFeeCurrentKeeperBypassV2.t.sol audit/dex-fee-current-v2/test/
          ln -s "$GITHUB_WORKSPACE/lib/forge-std" audit/dex-fee-current-v2/lib/forge-std
          cat > audit/dex-fee-current-v2/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          solc_version = "0.8.21"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          gas_limit = "18446744073709551615"
          EOF
      - name: Run probe
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/dex-fee-current-v2 --match-path test/DexFeeCurrentKeeperBypassV2.t.sol -vvvv \
            2>&1 | tee evidence-dex-fee-current-v2/probe.log
      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E "(Best\(|Result\(|Suite result|Failing tests|Error:)" evidence-dex-fee-current-v2/probe.log \
            | tee evidence-dex-fee-current-v2/summary.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dex-fee-current-keeper-bypass-v2
          path: evidence-dex-fee-current-v2/
          if-no-files-found: error
          retention-days: 30
