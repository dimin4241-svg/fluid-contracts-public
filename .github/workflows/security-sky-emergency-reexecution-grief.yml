name: Security Sky staged emergency re-execution

on:
  push:
    branches:
      - audit/sky-ilk-registry-race-runner-20260806
    paths:
      - '.github/workflows/security-sky-emergency-reexecution-grief.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Sky PoC branch
        uses: actions/checkout@v4
        with:
          repository: dimin4241-svg/dss-emergency-spells
          ref: audit/ilk-registry-readd-proof
          path: sky-poc
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run staged emergency proofs with RPC failover
        shell: bash
        working-directory: sky-poc
        run: |
          set -euo pipefail
          mkdir -p ../evidence-sky-emergency-reexecution
          endpoints=(
            'https://ethereum-rpc.publicnode.com'
            'https://eth.drpc.org'
            'https://mainnet.gateway.tenderly.co'
            'https://eth-mainnet.public.blastapi.io'
            'https://rpc.payload.de'
          )
          tests=(
            testStagedReAddForcesRepeatedMultiOsmStopExecutions
            testStagedReAddForcesRepeatedMultiClipBreakerExecutions
          )
          forge build 2>&1 | tee ../evidence-sky-emergency-reexecution/forge-build.log
          for test_name in "${tests[@]}"; do
            passed=0
            for rpc in "${endpoints[@]}"; do
              log="../evidence-sky-emergency-reexecution/${test_name}.log"
              set +e
              ETH_RPC_URL="$rpc" forge test \
                --match-path src/IlkRegistryEmergencyReexecutionGrief.t.sol \
                --match-test "$test_name" \
                -vvvv > "$log" 2>&1
              rc=$?
              set -e
              cat "$log"
              if [[ $rc -eq 0 ]] && grep -q '\[PASS\]' "$log"; then
                echo "CASE_PASS $test_name rpc=$rpc" | tee -a ../evidence-sky-emergency-reexecution/summary.log
                passed=1
                break
              fi
            done
            [[ $passed -eq 1 ]]
          done
          grep -hE '(staged Registry additions|forced OSM|forced Clip|total OSM|total Clip|maximum single|PASS|Suite result)' \
            ../evidence-sky-emergency-reexecution/test*.log \
            | tee ../evidence-sky-emergency-reexecution/key-results.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-staged-emergency-reexecution-grief
          path: evidence-sky-emergency-reexecution/
          if-no-files-found: error
          retention-days: 30
