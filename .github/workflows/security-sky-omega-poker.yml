name: Security Sky OmegaPoker exact downstream deltas

on:
  push:
    branches:
      - audit/sky-ilk-registry-race-runner-20260806
    paths:
      - '.github/workflows/security-sky-omega-poker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omega-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Sky PoC branch
        uses: actions/checkout@v4
        with:
          repository: dimin4241-svg/dss-emergency-spells
          ref: audit/ilk-registry-readd-proof
          path: sky-poc
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Select stable archive Ethereum RPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-sky-omega-poker
          endpoints=(
            'https://mainnet.gateway.tenderly.co'
            'https://ethereum-rpc.publicnode.com'
            'https://eth.drpc.org'
            'https://rpc.payload.de'
            'https://eth-mainnet.public.blastapi.io'
          )
          for rpc in "${endpoints[@]}"; do
            if output=$(timeout 30 cast call 0xDd538C362dF996727054AC8Fb67ef5394eC9b8b9 'ilkCount()(uint256)' --block 25694337 --rpc-url "$rpc" 2>&1) && [[ "$output" =~ ^[0-9]+ ]]; then
              echo "ETH_RPC_URL=$rpc" >> "$GITHUB_ENV"
              echo "selected=$rpc pinned_omega_ilk_count=$output" | tee evidence-sky-omega-poker/rpc.log
              exit 0
            fi
          done
          exit 1

      - name: Run deployed OmegaPoker differential proof
        shell: bash
        working-directory: sky-poc
        run: |
          set -o pipefail
          forge test \
            --threads 1 \
            --match-path src/IlkRegistryOmegaPokerImpact.t.sol \
            --match-test testMassReAddChangesDeployedOmegaPokerExecution \
            -vvvv 2>&1 | tee ../evidence-sky-omega-poker/forge-test.log

      - name: Extract proof summary
        if: always()
        shell: bash
        run: |
          {
            cat evidence-sky-omega-poker/rpc.log 2>/dev/null || true
            grep -E '(PASS|FAIL|Suite result|Failing tests|Error:|Omega changed legacy ilk|spot before|spot after|fork block|registry count|restored legacy|Omega ilk count|Omega OSM count|legacy ilks cached|refresh gas|poke gas|legacy Vat spots|block gas limit)' evidence-sky-omega-poker/forge-test.log 2>/dev/null || true
          } | tee evidence-sky-omega-poker/summary.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-omega-poker-exact-downstream-deltas
          path: evidence-sky-omega-poker/
          if-no-files-found: error
          retention-days: 30
