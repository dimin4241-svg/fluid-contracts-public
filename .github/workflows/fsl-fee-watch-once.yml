name: fSL feeOrReward one-shot

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Run exhaustive on-chain check
        id: check
        continue-on-error: true
        run: |
          python scripts/security/check_fsl_fee_or_reward.py > fsl-results.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Print result
        if: always()
        run: cat fsl-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsl-results
          path: fsl-results.json

