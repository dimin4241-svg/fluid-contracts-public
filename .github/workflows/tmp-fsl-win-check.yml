name: Temporary fSL Windows Check

on:
  push:
    branches: [main]
    paths: ['fsl-win-trigger.txt']

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: bash
        run: python -m pip install --disable-pip-version-check requests
      - name: Run all 21 fSL checks
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > fsl-current-result.json 2> fsl-current-errors.txt
          code=$?
          cat fsl-current-result.json
          cat fsl-current-errors.txt >&2 || true
          echo "$code" > fsl-current-exit.txt
      - name: Commit result to main
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fsl-current-result.json fsl-current-errors.txt fsl-current-exit.txt
          git commit -m 'Record current fSL feeOrReward Windows result' || exit 0
          git push origin HEAD:main
