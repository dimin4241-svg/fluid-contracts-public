name: Live fSL feeOrReward check

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - '.github/workflows/check-fsl-fee-or-reward-live.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Run exhaustive fSL feeOrReward check
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee fsl-fee-or-reward.json
          code=${PIPESTATUS[0]}
          echo "CHECK_EXIT_CODE=$code"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-fee-or-reward-live
          path: fsl-fee-or-reward.json
