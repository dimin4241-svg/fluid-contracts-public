name: fSL runtime writeback 2026-08-18 07:00 UTC

on:
  push:
    paths:
      - '.github/workflows/fsl-runtime-writeback-20260818-0700.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check all 21 canonical Routescan URLs
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, time, datetime, pathlib
          selector='0xe47a882d'
          T=[
          ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),
          ('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
          ('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
          ('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
          ('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),
          ('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),
          ('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
          ('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),
          ('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),
          ('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
          ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),
          ('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),
          ('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),
          ('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),
          ('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),
          ('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),
          ('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),
          ('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c')]
          RPC={1:['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com'],8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']}
          def dec(h):
              x=int(h,16)&0xffffffff
              return x-(1<<32) if x&0x80000000 else x
          def get(url):
              last=None
              for a in range(3):
                  try:
                      q=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(q,timeout=30) as r:return json.loads(r.read().decode())
                  except Exception as e:last=repr(e);time.sleep(a+1)
              raise RuntimeError(last)
          def rpc(url,addr):
              b=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':addr,'data':selector},'latest']}).encode()
              q=urllib.request.Request(url,data=b,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(q,timeout=30) as r:j=json.loads(r.read().decode())
              if not isinstance(j.get('result'),str):raise RuntimeError(str(j))
              return j['result']
          checked=datetime.datetime.now(datetime.timezone.utc).isoformat()
          rows=[];errors=[];nonzero=[]
          for i,(net,cid,addr) in enumerate(T,1):
              url=f'https://api.routescan.io/v2/network/mainnet/evm/{cid}/etherscan/api?action=eth_call&data={selector}&module=proxy&tag=latest&to={addr}'
              try:
                  j=get(url);res=j.get('result')
                  if not isinstance(res,str) or not res.startswith('0x'):raise RuntimeError('bad payload '+json.dumps(j))
                  raw=dec(res);row={'i':i,'network':net,'chain_id':cid,'address':addr,'url':url,'source':'routescan','result':res,'raw_int32':raw,'annual_percent':raw/10000}
              except Exception as e:
                  row=None;fb=[]
                  for u in RPC.get(cid,[]):
                      try:
                          res=rpc(u,addr);raw=dec(res);row={'i':i,'network':net,'chain_id':cid,'address':addr,'url':url,'source':u,'routescan_error':repr(e),'result':res,'raw_int32':raw,'annual_percent':raw/10000};break
                      except Exception as fe:fb.append({'rpc':u,'error':repr(fe)})
                  if row is None:
                      errors.append({'i':i,'network':net,'chain_id':cid,'address':addr,'url':url,'routescan_error':repr(e),'fallback_errors':fb});continue
              if row['raw_int32']!=0:
                  conf=[]
                  for u in RPC.get(cid,[]):
                      try:
                          rr=rpc(u,addr);conf.append({'rpc':u,'result':rr,'raw_int32':dec(rr)})
                      except Exception as ce:conf.append({'rpc':u,'error':repr(ce)})
                  row['independent_confirmations']=conf;nonzero.append(row)
              rows.append(row)
          out={'checked_at_utc':checked,'target_count':21,'success_count':len(rows),'error_count':len(errors),'nonzero':nonzero,'errors':errors,'results':rows}
          pathlib.Path('.github/fsl-runtime-result-20260818-0700.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({'checked_at_utc':checked,'success_count':len(rows),'error_count':len(errors),'nonzero':nonzero},indent=2))
          PY
      - name: Write result back
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/fsl-runtime-result-20260818-0700.json
          git commit -m 'Record current fSL feeOrReward check' || exit 0
          git push
