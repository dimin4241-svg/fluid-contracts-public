name: Temporary fSL Automation Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Run all 21 canonical fSL checks
        id: fsl
        continue-on-error: true
        run: |
          mkdir -p fsl-out
          python scripts/security/check_fsl_fee_or_reward.py > fsl-out/result.json 2> fsl-out/errors.txt
          code=$?
          cat fsl-out/result.json
          cat fsl-out/errors.txt >&2 || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-fsl-automation-result
          path: fsl-out/
          if-no-files-found: error
      - name: Require complete zero result
        run: |
          code='${{ steps.fsl.outputs.exit_code }}'
          if [ "$code" != "0" ]; then exit "$code"; fi
