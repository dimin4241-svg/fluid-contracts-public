name: Security Plasma Vault T4 positions

on:
  push:
    branches:
      - audit/plasma-smart-lending-execution-20260806
    paths:
      - 'test/security/PlasmaVaultT4Positions.t.sol'
      - '.github/workflows/security-plasma-vault-t4-positions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve fresh Plasma fork block
        shell: bash
        run: |
          echo "PLASMA_FORK_BLOCK=$(cast block-number --rpc-url "$PLASMA_RPC_URL")" >> "$GITHUB_ENV"

      - name: Prepare isolated position harness
        shell: bash
        run: |
          rm -rf audit/t4-positions-poc
          mkdir -p audit/t4-positions-poc/test audit/t4-positions-poc/lib evidence-plasma-vault-t4-positions
          cp test/security/PlasmaVaultT4Positions.t.sol audit/t4-positions-poc/test/
          cp -R lib/forge-std audit/t4-positions-poc/lib/forge-std

      - name: Enumerate real T4 debt positions
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --root audit/t4-positions-poc \
            --via-ir \
            --match-path test/PlasmaVaultT4Positions.t.sol \
            -vvvv 2>&1 | tee evidence-plasma-vault-t4-positions/positions.log

      - name: Extract position evidence
        if: always()
        shell: bash
        run: |
          grep -E "(T4Target|BorrowPosition|PositionSummary)\(|Suite result|Failing tests|Error:" \
            evidence-plasma-vault-t4-positions/positions.log \
            | tee evidence-plasma-vault-t4-positions/summary.log || true

      - name: Upload position evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-vault-t4-positions
          path: evidence-plasma-vault-t4-positions/
          if-no-files-found: error
          retention-days: 30
