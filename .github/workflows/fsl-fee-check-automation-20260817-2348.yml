            ("Ethereum",1,"0x9b1f75ea07723F331996831f6d04AD4900d1A3B3","https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0x9b1f75ea07723F331996831f6d04AD4900d1A3B3"),
            ("Ethereum",1,"0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF","https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF"),
            ("Ethereum",1,"0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2","https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2"),
            ("Ethereum",1,"0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f","https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f"),
            ("Ethereum",1,"0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6","https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6"),
            ("Ethereum",1,"0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70","https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70"),
            ("Ethereum",1,"0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c","https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c"),
          ]
          fallbacks = {
            1:["https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com"],
            8453:["https://base-rpc.publicnode.com","https://mainnet.base.org"],
            137:["https://polygon-bor-rpc.publicnode.com","https://polygon-rpc.com"],
            42161:["https://arbitrum-one-rpc.publicnode.com","https://arb1.arbitrum.io/rpc"],
            9745:["https://rpc.plasma.to","https://plasma.drpc.org"],
          }
          def decode_int32(h):
            v=int(h,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def get_json(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 fSL-watch"})
            with urllib.request.urlopen(req,timeout=25) as r: return json.loads(r.read().decode())
          def rpc_call(rpc,address):
            body=json.dumps({"jsonrpc":"2.0","id":1,"method":"eth_call","params":[{"to":address,"data":SELECTOR},"latest"]}).encode()
            req=urllib.request.Request(rpc,data=body,headers={"Content-Type":"application/json","User-Agent":"Mozilla/5.0 fSL-watch"})
            with urllib.request.urlopen(req,timeout=25) as r: j=json.loads(r.read().decode())
            res=j.get("result")
            if not isinstance(res,str) or not res.startswith("0x"): raise RuntimeError(str(j))
            return res
          checked_at=datetime.now(timezone.utc).isoformat()
          rows=[]; failures=[]
          for network,chain,address,url in targets:
            result=None; source=None; errors=[]
            for attempt in range(3):
              try:
                j=get_json(url); result=j.get("result")
                if not isinstance(result,str) or not result.startswith("0x"): raise RuntimeError(str(j))
                source="routescan"; break
              except Exception as e:
                errors.append(f"routescan:{e!r}"); time.sleep(1+attempt)
            if result is None:
              for rpc in fallbacks.get(chain,[]):
                try: result=rpc_call(rpc,address); source=rpc; break
                except Exception as e: errors.append(f"{rpc}:{e!r}")
            if result is None:
              failures.append({"network":network,"chain_id":chain,"address":address,"url":url,"errors":errors}); continue
            raw=decode_int32(result); confirm=[]
            if raw!=0:
              for rpc in fallbacks.get(chain,[]):
                if rpc==source: continue
                try:
                  r2=rpc_call(rpc,address); raw2=decode_int32(r2)
                  confirm.append({"rpc":rpc,"result":r2,"raw_int32":raw2,"matches":raw2==raw})
                except Exception as e: confirm.append({"rpc":rpc,"error":repr(e)})
            rows.append({"network":network,"chain_id":chain,"address":address,"url":url,"source":source,"result":result,"raw_int32":raw,"annual_percent":raw/10000,"errors":errors,"confirmation":confirm})
          out={"checked_at_utc":checked_at,"target_count":len(targets),"success_count":len(rows),"failure_count":len(failures),"nonzero":[r for r in rows if r["raw_int32"]!=0],"results":rows,"failures":failures}
          p=pathlib.Path("scripts/security/fsl_result_20260817_2348.json"); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
