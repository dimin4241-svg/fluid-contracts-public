        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/security/fsl_result_20260817_2348.json
          git commit -m "Store fSL feeOrReward automation result" || exit 0
