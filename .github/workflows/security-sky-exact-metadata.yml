name: Security Sky exact metadata restoration

on:
  push:
    branches:
      - audit/sky-ilk-registry-race-runner-20260806
    paths:
      - '.github/workflows/security-sky-exact-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-restoration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Sky PoC branch
        uses: actions/checkout@v4
        with:
          repository: dimin4241-svg/dss-emergency-spells
          ref: audit/ilk-registry-readd-proof
          path: sky-poc
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Select archive Ethereum RPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-sky-exact-metadata
          endpoints=(
            'https://eth.drpc.org'
            'https://rpc.payload.de'
            'https://eth-mainnet.public.blastapi.io'
            'https://mainnet.gateway.tenderly.co'
            'https://ethereum-rpc.publicnode.com'
          )
          for rpc in "${endpoints[@]}"; do
            if output=$(timeout 30 cast call 0x5a464C28D19848f44199D003BeF5ecc87d090F87 'count()(uint256)' --block 23118263 --rpc-url "$rpc" 2>&1) && [[ "$output" =~ ^[0-9]+ ]]; then
              echo "ETH_RPC_URL=$rpc" >> "$GITHUB_ENV"
              echo "selected=$rpc historical_registry_count=$output" | tee evidence-sky-exact-metadata/rpc.log
              exit 0
            fi
          done
          exit 1

      - name: Run exact semantic metadata restoration proof
        shell: bash
        working-directory: sky-poc
        run: |
          set -o pipefail
          forge test \
            --match-path src/IlkRegistryMassReAdd.t.sol \
            --match-test testAttackerMassReAddsGovernanceRemovedIlks \
            -vvvv 2>&1 | tee ../evidence-sky-exact-metadata/forge-test.log

      - name: Extract proof summary
        if: always()
        shell: bash
        run: |
          {
            cat evidence-sky-exact-metadata/rpc.log 2>/dev/null || true
            grep -E '(PASS|FAIL|Suite result|Failing tests|Error:|governance removals reversed|adapters still live|exact semantic metadata restores|cleaned count|post-attack count)' evidence-sky-exact-metadata/forge-test.log 2>/dev/null || true
          } | tee evidence-sky-exact-metadata/summary.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-exact-metadata-restoration
          path: evidence-sky-exact-metadata/
          if-no-files-found: error
          retention-days: 30
