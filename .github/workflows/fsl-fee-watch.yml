name: fSL feeOrReward check

on:
  push:
    branches: [audit/read-only-dex-fees-20260805]
    paths: [.github/workflows/fsl-fee-watch.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Check all fSL rates
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > fsl-result.json
          code=$?
          cat fsl-result.json
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsl-result
          path: fsl-result.json
