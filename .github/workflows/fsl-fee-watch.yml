name: fSL feeOrReward check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests
      - name: Run exhaustive on-chain check
        id: check
        continue-on-error: true
        run: |
          mkdir -p fsl-check-output
          python scripts/security/check_fsl_fee_or_reward.py > fsl-check-output/result.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsl-fee-or-reward-result
          path: fsl-check-output/result.json
          if-no-files-found: error
      - name: Fail on incomplete check
        if: steps.check.outputs.exit_code == '2'
        run: exit 1
