name: fSL fallback RPC check 20260813

on:
  push:
    paths:
      - '.github/workflows/fsl-fallback-20260813.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Base Polygon Arbitrum through two public RPCs
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, time
          selector='0xe47a882d'
          groups={
            'Base':(8453,['https://base-rpc.publicnode.com','https://mainnet.base.org'],[
              '0x4563134183e45D9502015db14B263E31781099bB','0x983107BB3dcb71f3A30176114D8a17c454A62514','0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6','0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A']),
            'Polygon':(137,['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],[
              '0xa779B6736385930145F4856226Cd3E3691B72458','0x4563134183e45D9502015db14B263E31781099bB','0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6','0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A']),
            'Arbitrum':(42161,['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],[
              '0x82C53239c4CFC89A8E55A691422af24c18A944b1','0x1F0bFd9862ae58208d26db0d80797974434EC013','0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'])}
          def dec32(h):
              x=int(h,16)&0xffffffff
              return x-(1<<32) if x&0x80000000 else x
          rows=[]
          for net,(cid,rpcs,addrs) in groups.items():
              for addr in addrs:
                  vals=[]
                  for rpc in rpcs:
                      payload=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':addr,'data':selector},'latest']}).encode()
                      req=urllib.request.Request(rpc,data=payload,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
                      try:
                          with urllib.request.urlopen(req,timeout=30) as r: body=r.read().decode()
                          j=json.loads(body); result=j.get('result')
                          if isinstance(result,str) and result.startswith('0x'):
                              raw=dec32(result); vals.append((rpc,result,raw))
                              print(json.dumps({'network':net,'chain_id':cid,'address':addr,'rpc':rpc,'result':result,'raw':raw,'annual_percent':raw/10000}),flush=True)
                          else:
                              print(json.dumps({'network':net,'address':addr,'rpc':rpc,'ERROR':body}),flush=True)
                      except Exception as e:
                          print(json.dumps({'network':net,'address':addr,'rpc':rpc,'ERROR':repr(e)}),flush=True)
                      time.sleep(.3)
                  rows.append({'network':net,'chain_id':cid,'address':addr,'vals':vals})
          nonzero=[]; unconfirmed=[]; mismatches=[]
          for row in rows:
              vals=row['vals']
              if not vals:
                  unconfirmed.append({k:row[k] for k in ('network','chain_id','address')})
                  continue
              raws={v[2] for v in vals}
              if len(raws)>1: mismatches.append({'network':row['network'],'chain_id':row['chain_id'],'address':row['address'],'raws':list(raws)})
              if any(v[2]!=0 for v in vals): nonzero.append({'network':row['network'],'chain_id':row['chain_id'],'address':row['address'],'vals':vals})
          print('SUMMARY '+json.dumps({'targets':len(rows),'nonzero':nonzero,'unconfirmed':unconfirmed,'mismatches':mismatches}),flush=True)
          PY
