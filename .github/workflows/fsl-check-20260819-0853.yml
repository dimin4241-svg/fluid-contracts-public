name: Canonical fSL feeOrReward check 2026-08-19

on:
  push:
    branches: [audit/read-only-dex-fees-20260805]
    paths:
      - '.github/workflows/fsl-check-20260819-0853.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Check all 21 exact canonical Routescan URLs
        run: python scripts/security/check_fsl_check_20260819.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation-results/fsl-20260819-0853.json
          git commit -m 'Record fresh fSL feeOrReward check 2026-08-19' || exit 0
          git push origin HEAD:audit/read-only-dex-fees-20260805

