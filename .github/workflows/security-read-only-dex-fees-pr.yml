name: Security read-only DEX fee scan (PR)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check web3==7.13.0
      - name: Scan deployed DEX fees (read-only)
        shell: bash
        run: |
          set -o pipefail
          python scripts/security/read_only_scan_dex_fees.py | tee deployed-dex-fees.txt
      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-dex-fees-pr
          path: deployed-dex-fees.txt
          if-no-files-found: warn
