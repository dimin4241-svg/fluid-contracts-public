name: fSL fee watch once
on:
  push:
    branches: [audit/read-only-dex-fees-20260805]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run fSL fee check
        run: python scripts/security/check_fsl_fee_or_reward.py | tee fsl_fee_results.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsl-fee-results
          path: fsl_fee_results.json

