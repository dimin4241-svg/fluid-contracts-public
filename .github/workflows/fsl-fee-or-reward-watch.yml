name: fSL feeOrReward watch

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check all fSL contracts
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > fsl-fee-or-reward-result.json
          code=$?
          cat fsl-fee-or-reward-result.json
          echo "checker_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        id: checker
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsl-fee-or-reward-result
          path: fsl-fee-or-reward-result.json
          if-no-files-found: error
