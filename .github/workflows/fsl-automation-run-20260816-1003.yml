          '''
          targets=[]
          for line in text.splitlines():
              line=line.strip()
              if line:
                  net,cid,addr,url=line.split('|',3); targets.append((net,int(cid),addr,url))
          rpcs={8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],9745:['https://rpc.plasma.to','https://plasma.drpc.org'],137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],1:['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com']}
          def dec(h):
              x=int(h,16)&0xffffffff
              return x-(1<<32) if x&0x80000000 else x
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r: return json.loads(r.read().decode())
          def rpc(url,addr):
              p=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':addr,'data':selector},'latest']}).encode()
              req=urllib.request.Request(url,data=p,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r: return json.loads(r.read().decode())
          def check(t):
              net,cid,addr,url=t; row={'network':net,'chain_id':cid,'address':addr,'url':url,'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  j=get(url); res=j.get('result')
                  if not(isinstance(res,str) and res.startswith('0x')): raise RuntimeError(str(j))
                  row.update(routescan_ok=True,result=res,raw=dec(res),annual_percent=dec(res)/10000)
              except Exception as e:
                  row.update(routescan_ok=False,routescan_error=repr(e))
              if (not row.get('routescan_ok')) or row.get('raw')!=0:
                  fb=[]
                  for u in rpcs[cid]:
                      try:
                          j=rpc(u,addr); res=j.get('result')
                          if not(isinstance(res,str) and res.startswith('0x')): raise RuntimeError(str(j))
                          fb.append({'rpc':u,'result':res,'raw':dec(res),'annual_percent':dec(res)/10000})
                      except Exception as e: fb.append({'rpc':u,'error':repr(e)})
                  row['fallbacks']=fb
              return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=21) as ex: rows=list(ex.map(check,targets))
          unresolved=[]; nonzero=[]
          for row in rows:
              print('ROW '+json.dumps(row,sort_keys=True),flush=True)
              if row.get('routescan_ok'):
                  if row['raw']!=0:
                      confirmed=[x for x in row.get('fallbacks',[]) if x.get('raw')==row['raw']]
                      (nonzero if confirmed else unresolved).append(row)
              else:
                  vals=[x for x in row.get('fallbacks',[]) if 'raw' in x]
                  raws={x['raw'] for x in vals}
                  if len(raws)!=1: unresolved.append(row)
                  elif next(iter(raws))!=0: nonzero.append(row)
          print('SUMMARY '+json.dumps({'target_count':len(rows),'nonzero':nonzero,'unresolved':unresolved,'completed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()},sort_keys=True),flush=True)
          if unresolved: raise SystemExit(2)
          PY
