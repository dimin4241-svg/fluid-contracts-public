name: Temporary fSL PR open check 20260807-0304

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  check:
    if: github.head_ref == 'automation/fsl-check-20260807-0304'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Run exact canonical fSL checker
        run: python scripts/security/check_fsl_exact_runtime.py
