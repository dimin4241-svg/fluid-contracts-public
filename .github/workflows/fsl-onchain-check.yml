name: fSL on-chain check

on:
  push:
    paths:
      - '.github/workflows/fsl-onchain-check.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Run exact fSL feeOrReward checker
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee fsl-check.json
          rc=${PIPESTATUS[0]}
          echo "checker_exit_code=$rc"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-check
          path: fsl-check.json
