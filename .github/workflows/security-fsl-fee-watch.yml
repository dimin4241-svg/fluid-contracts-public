name: Security fSL feeOrReward watch

on:
  pull_request:
    paths:
      - 'scripts/security/check_fsl_fee_or_reward.py'
      - '.github/workflows/security-fsl-fee-watch.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Query all deployed fSL contracts
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > /tmp/fsl-result.json
          code=$?
          cat /tmp/fsl-result.json
          echo "checker_exit_code=$code"
          exit 0
