name: Security fSL feeOrReward watch
# refresh marker: 2026-08-14T22:58Z

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - 'scripts/security/check_fsl_fee_or_reward.py'
      - '.github/workflows/security-fsl-fee-watch.yml'
  pull_request:
    paths:
      - 'scripts/security/check_fsl_fee_or_reward.py'
      - '.github/workflows/security-fsl-fee-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Query all deployed fSL contracts
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py
          code=$?
          echo "checker_exit_code=$code"
          exit 0
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsl-fee-or-reward-results
          path: fsl_fee_or_reward_results.json
          if-no-files-found: error
