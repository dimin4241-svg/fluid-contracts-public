name: Security Plasma Vault T4 constants probe

on:
  push:
    branches:
      - audit/plasma-smart-lending-execution-20260806
    paths:
      - 'test/security/PlasmaVaultT4ConstantsProbe.t.sol'
      - '.github/workflows/security-plasma-vault-t4-constants-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constants-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve fresh Plasma fork block
        shell: bash
        run: |
          echo "PLASMA_FORK_BLOCK=$(cast block-number --rpc-url "$PLASMA_RPC_URL")" >> "$GITHUB_ENV"

      - name: Prepare isolated constants probe
        shell: bash
        run: |
          rm -rf audit/t4-constants-poc
          mkdir -p audit/t4-constants-poc/test audit/t4-constants-poc/lib evidence-vault-t4-constants
          cp test/security/PlasmaVaultT4ConstantsProbe.t.sol audit/t4-constants-poc/test/
          cp -R lib/forge-std audit/t4-constants-poc/lib/forge-std

      - name: Read live T4 constants
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --root audit/t4-constants-poc \
            --via-ir \
            --match-path test/PlasmaVaultT4ConstantsProbe.t.sol \
            -vvvv 2>&1 | tee evidence-vault-t4-constants/constants.log

      - name: Extract summary
        if: always()
        shell: bash
        run: |
          grep -E "ConstantsResult\(|Suite result|Failing tests|Error:" \
            evidence-vault-t4-constants/constants.log \
            | tee evidence-vault-t4-constants/constants-summary.log || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-vault-t4-constants-probe
          path: evidence-vault-t4-constants/
          if-no-files-found: error
          retention-days: 30
