name: fSL live one-shot check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fsl-live-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check all fSL targets
        shell: bash
        run: |
          mkdir -p automation
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > automation/fsl-live-result.json
          status=$?
          echo "$status" > automation/fsl-live-exit-code.txt
          cat automation/fsl-live-result.json
          exit 0
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/fsl-live-result.json automation/fsl-live-exit-code.txt
          git commit -m 'Record fresh fSL feeOrReward check [skip ci]' || exit 0
          git push origin HEAD:main

