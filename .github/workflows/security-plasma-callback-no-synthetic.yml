name: Security Plasma callback no-synthetic proof

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - 'test/security/PlasmaGhoUsdtCallbackNoSynthetic.t.sol'
      - '.github/workflows/security-plasma-callback-no-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLASMA_RPC_URL: 'https://rpc.plasma.to'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Pin deployed state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/fork-poc/test evidence-plasma-callback
          BLOCK="$(cast block-number --rpc-url "${PLASMA_RPC_URL}")"
          echo "PLASMA_FORK_BLOCK=${BLOCK}" >> "${GITHUB_ENV}"
          echo "fork_block=${BLOCK}" | tee evidence-plasma-callback/deployed-state.txt
      - name: Prepare isolated harness
        run: cp test/security/PlasmaGhoUsdtCallbackNoSynthetic.t.sol audit/fork-poc/test/
      - name: Run callback deployed fork proof
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/fork-poc --via-ir \
            --match-path test/PlasmaGhoUsdtCallbackNoSynthetic.t.sol \
            -vvvv 2>&1 | tee evidence-plasma-callback/proof.log
      - name: Extract summary
        if: always()
        shell: bash
        run: |
          grep -E 'CallbackExistingFundsProof\(|Suite result|Failing tests|Compiler run failed|Error:' \
            evidence-plasma-callback/proof.log \
            | tee evidence-plasma-callback/summary.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-callback-no-synthetic-proof
          path: evidence-plasma-callback/
          if-no-files-found: error
          retention-days: 30
