name: fSL canonical check persist 20260821

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - .github/workflows/fsl-check-persist-20260821.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - name: Check and persist all 21 canonical URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,datetime,pathlib
          src=pathlib.Path('.github/workflows/fsl-check-20260821-0044.yml').read_text()
          urls=[]
          for u in re.findall(r'https://api\.routescan\.io/[^"\\\s]+',src):
            if u not in urls: urls.append(u)
          assert len(urls)==21, len(urls)
          chain_names={8453:'Base',9745:'Plasma',137:'Polygon',42161:'Arbitrum',1:'Ethereum'}
          fallback={1:['https://ethereum-rpc.publicnode.com','https://cloudflare-eth.com'],8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']}
          def raw32(s):
            v=int(s,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read().decode())
          def post(url,address):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':address,'data':'0xe47a882d'},'latest']}).encode()
            req=urllib.request.Request(url,data=body,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read().decode())
          rows=[]
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          for url in urls:
            cid=int(re.search(r'/evm/(\d+)/',url).group(1)); address=re.search(r'[?&]to=(0x[0-9A-Fa-f]{40})',url).group(1)
            rec={'network':chain_names[cid],'chain_id':cid,'address':address,'url':url,'checked_at_utc':now}
            try:
              j=get(url); result=j.get('result')
              if not isinstance(result,str) or not result.startswith('0x'): raise RuntimeError(str(j))
              rec.update(source='routescan',result=result,raw=raw32(result),annual_percent=raw32(result)/10000)
            except Exception as e:
              rec['routescan_error']=repr(e); ok=False
              for rpc in fallback[cid]:
                try:
                  j=post(rpc,address); result=j.get('result')
                  if not isinstance(result,str) or not result.startswith('0x'): raise RuntimeError(str(j))
                  rec.update(source=rpc,result=result,raw=raw32(result),annual_percent=raw32(result)/10000); ok=True; break
                except Exception as ee: rec.setdefault('fallback_errors',[]).append(f'{rpc}: {ee!r}')
              if not ok: rec['unconfirmed']=True
            rows.append(rec)
          out={'checked_at_utc':now,'total':len(rows),'confirmed':sum('raw' in r for r in rows),'unconfirmed':sum(r.get('unconfirmed',False) for r in rows),'nonzero':[r for r in rows if r.get('raw',0)!=0],'results':rows}
          pathlib.Path('automation').mkdir(exist_ok=True)
          pathlib.Path('automation/fsl-check-latest.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit result snapshot
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add automation/fsl-check-latest.json
          git commit -m "Record fSL feeOrReward check 2026-08-21" || true
          git push origin HEAD:audit/read-only-dex-fees-20260805
