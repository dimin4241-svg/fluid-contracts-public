name: Live fSL feeOrReward check

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check all 21 canonical fSL targets
        id: check
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee /tmp/fsl-check.json
          code=${PIPESTATUS[0]}
          echo "checker_exit=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/fsl-check.json
          if [ "$code" -eq 2 ]; then exit 2; fi
          if [ "$code" -eq 10 ]; then echo 'NONZERO_FSL_DETECTED=true'; fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-live-check
          path: /tmp/fsl-check.json
          if-no-files-found: error
