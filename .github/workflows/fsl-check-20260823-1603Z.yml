name: fresh fSL canonical check 20260823-1603Z
on:
  push:
    branches: [audit/read-only-dex-fees-20260805]
    paths: [.github/workflows/fsl-check-20260823-1603Z.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
          fetch-depth: 0
      - name: Probe exact 21 canonical URLs
        run: |
          mkdir -p automation-results
          python3 - <<'PY'
          import json, urllib.request, time
          from datetime import datetime, timezone
          selector='0xe47a882d'
          targets=[
          ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
          ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c')]
          fallbacks={1:['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com'],8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']}
          def url(cid,a): return f'https://api.routescan.io/v2/network/mainnet/evm/{cid}/etherscan/api?action=eth_call&data={selector}&module=proxy&tag=latest&to={a}'
          def dec(s):
            v=int(s,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def valid(s):
            try: return isinstance(s,str) and s.startswith('0x') and int(s,16)>=0
            except: return False
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 fsl-watch'})
            with urllib.request.urlopen(req,timeout=25) as r: return r.status,json.loads(r.read().decode())
          def post(u,a):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':a,'data':selector},'latest']}).encode()
            req=urllib.request.Request(u,data=body,headers={'content-type':'application/json','user-agent':'Mozilla/5.0 fsl-watch'})
            with urllib.request.urlopen(req,timeout=25) as r: return r.status,json.loads(r.read().decode())
          out=[]; now=datetime.now(timezone.utc).isoformat()
          for net,cid,a in targets:
            rec={'network':net,'chain_id':cid,'address':a,'canonical_url':url(cid,a)}
            try:
              st,j=get(rec['canonical_url']); s=j.get('result'); rec['routescan_http_status']=st
              if not valid(s): raise Exception(repr(j))
              rec.update(result=s,raw_int32=dec(s),annual_percent=dec(s)/10000,routescan_confirmed=True)
            except Exception as e:
              rec['routescan_confirmed']=False; rec['routescan_error']=repr(e)
            if not rec.get('routescan_confirmed') or rec.get('raw_int32')!=0:
              rec['fallback_attempts']=[]
              for rpc in fallbacks[cid]:
                try:
                  st,j=post(rpc,a); s=j.get('result')
                  if not valid(s): raise Exception(repr(j))
                  att={'rpc':rpc,'http_status':st,'result':s,'raw_int32':dec(s),'annual_percent':dec(s)/10000}; rec['fallback_attempts'].append(att)
                  rec['fallback_confirmed']=True; rec['fallback_rpc']=rpc; rec['fallback_result']=s; rec['fallback_raw_int32']=dec(s)
                  if not rec.get('routescan_confirmed'): rec.update(result=s,raw_int32=dec(s),annual_percent=dec(s)/10000)
                  break
                except Exception as ee: rec['fallback_attempts'].append({'rpc':rpc,'error':repr(ee)})
              else: rec['fallback_confirmed']=False
            if rec.get('raw_int32',0)!=0:
              rec['nonzero_independently_confirmed']=bool(rec.get('routescan_confirmed') and rec.get('fallback_confirmed') and rec.get('fallback_raw_int32')==rec.get('raw_int32'))
            out.append(rec); time.sleep(.3)
          summary={'checked_at_utc':now,'target_count':21,'value_confirmed_count':sum('raw_int32' in x for x in out),'unconfirmed_count':sum('raw_int32' not in x for x in out),'nonzero_count':sum(x.get('raw_int32',0)!=0 for x in out),'confirmed_nonzero_count':sum(bool(x.get('nonzero_independently_confirmed')) for x in out),'results':out}
          open('automation-results/fsl-20260823-1603Z.json','w').write(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation-results/fsl-20260823-1603Z.json
          git commit -m 'Record fresh fSL probe 20260823-1603Z' || exit 0
          git push origin HEAD:audit/read-only-dex-fees-20260805
