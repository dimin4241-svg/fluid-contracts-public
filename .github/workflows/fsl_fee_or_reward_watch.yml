name: fSL feeOrReward watch

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Check all fSL feeOrReward values
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > fsl-fee-or-reward.json 2> fsl-fee-or-reward.stderr
          code=$?
          echo "checker_exit_code=$code"
          cat fsl-fee-or-reward.stderr || true
          cat fsl-fee-or-reward.json
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-fee-or-reward
          path: |
            fsl-fee-or-reward.json
            fsl-fee-or-reward.stderr
# automation-run-refresh
