name: fSL feeOrReward probe 2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fsl-fee-or-reward-probe-2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Query all fSL contracts
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > scripts/security/fsl-live-20260805-1602.json
          code=$?
          echo "$code" > scripts/security/fsl-live-20260805-1602-exit-code.txt
          exit 0
      - name: Save snapshot on audit branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/security/fsl-live-20260805-1602.json scripts/security/fsl-live-20260805-1602-exit-code.txt
          git commit -m 'Record fresh fSL feeOrReward on-chain snapshot' || exit 0
          git push origin HEAD:audit/read-only-dex-fees-20260805
