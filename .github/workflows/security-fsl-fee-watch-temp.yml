    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Check all 21 canonical Routescan URLs with RPC fallback
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, json, requests
          from datetime import datetime, timezone

          SELECTOR='0xe47a882d'
          targets=[
