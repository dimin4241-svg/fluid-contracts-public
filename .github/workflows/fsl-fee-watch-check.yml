name: fSL feeOrReward one-shot check

# Fresh verification trigger: 2026-08-06T12:55:00Z
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fsl-fee-watch-check.yml'
  pull_request:
    paths:
      - '.github/workflows/fsl-fee-watch-check.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check all fSL contracts
        shell: bash
        run: |
          python - <<'PY' | tee fsl-result.json
          import json, requests
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          selector = '0xe47a882d'
          targets = [
            ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),
            ('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
            ('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
            ('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
            ('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),
            ('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),
            ('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
            ('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),
            ('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),
            ('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
            ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),
            ('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),
            ('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),
            ('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),
            ('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),
            ('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),
            ('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),
            ('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c'),
          ]
          fallbacks = {
            1:['https://ethereum-rpc.publicnode.com','https://rpc.ankr.com/eth'],
            8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],
            137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],
            42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],
            9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com'],
          }

          def decode_int32(value):
            n = int(value, 16) & 0xffffffff
            return n - (1 << 32) if n & 0x80000000 else n

          def check(target):
            network, chain_id, address = target
            url = f'https://api.routescan.io/v2/network/mainnet/evm/{chain_id}/etherscan/api?module=proxy&action=eth_call&to={address}&data={selector}&tag=latest'
            errors = []
            try:
              body = requests.get(url, timeout=25, headers={'User-Agent':'fsl-watch/1.0'}).json()
              result = body.get('result')
              if isinstance(result, str) and result.startswith('0x'):
                raw = decode_int32(result)
                return {'network':network,'chain_id':chain_id,'address':address,'source':'routescan','result':result,'raw_int32':raw,'annual_percent':raw/10000}
              errors.append(f'routescan: {body}')
            except Exception as exc:
              errors.append(f'routescan: {exc!r}')
            payload = {'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':address,'data':selector},'latest']}
            for rpc in fallbacks[chain_id]:
              try:
                body = requests.post(rpc, json=payload, timeout=25).json()
                result = body.get('result')
                if isinstance(result, str) and result.startswith('0x'):
                  raw = decode_int32(result)
                  return {'network':network,'chain_id':chain_id,'address':address,'source':rpc,'result':result,'raw_int32':raw,'annual_percent':raw/10000}
                errors.append(f'{rpc}: {body}')
              except Exception as exc:
                errors.append(f'{rpc}: {exc!r}')
            return {'network':network,'chain_id':chain_id,'address':address,'error':errors}

          rows = []
          with ThreadPoolExecutor(max_workers=21) as pool:
            futures = [pool.submit(check, t) for t in targets]
            for future in as_completed(futures):
              rows.append(future.result())
          rows.sort(key=lambda r:(r['chain_id'], r['address'].lower()))
          failures = [r for r in rows if 'error' in r]
          nonzero = [r for r in rows if 'raw_int32' in r and r['raw_int32'] != 0]
          print(json.dumps({'checked_at_utc':datetime.now(timezone.utc).isoformat(),'target_count':len(targets),'success_count':len(rows)-len(failures),'failure_count':len(failures),'nonzero':nonzero,'results':rows}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-result
          path: fsl-result.json
          retention-days: 1
