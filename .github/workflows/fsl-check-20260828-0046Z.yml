name: fSL live canonical check
on:
  push:
    branches: [audit/read-only-dex-fees-20260805]
    paths: [.github/workflows/fsl-check-20260828-0046Z.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Check all 21 exact canonical Routescan URLs
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee fsl-current-live.json
          code=${PIPESTATUS[0]}
          echo "checker_exit=$code"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-current-live
          path: fsl-current-live.json
