          ("Ethereum",1,"0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c","https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c")]
          RPC={1:["https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com"],8453:["https://base-rpc.publicnode.com","https://mainnet.base.org"],137:["https://polygon-bor-rpc.publicnode.com","https://polygon-rpc.com"],42161:["https://arbitrum-one-rpc.publicnode.com","https://arb1.arbitrum.io/rpc"],9745:["https://rpc.plasma.to","https://plasma.drpc.org"]}
          def dec(h):
            x=int(h,16)&0xffffffff
            return x-(1<<32) if x&0x80000000 else x
          def get(url):
            q=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 fSL-watch"})
            with urllib.request.urlopen(q,timeout=12) as r:return json.loads(r.read().decode())
          def rpc(url,a):
            b=json.dumps({"jsonrpc":"2.0","id":1,"method":"eth_call","params":[{"to":a,"data":SELECTOR},"latest"]}).encode()
            q=urllib.request.Request(url,data=b,headers={"Content-Type":"application/json","User-Agent":"Mozilla/5.0 fSL-watch"})
            with urllib.request.urlopen(q,timeout=12) as r:j=json.loads(r.read().decode())
            v=j.get("result")
            if not isinstance(v,str) or not v.startswith("0x"):raise RuntimeError(str(j))
            return v
          def one(t):
            n,c,a,u=t; errs=[]; v=None; src=None
            try:
              j=get(u); v=j.get("result")
              if not isinstance(v,str) or not v.startswith("0x"):raise RuntimeError(str(j))
              src="routescan"
            except Exception as e: errs.append("routescan:"+repr(e))
            if v is None:
              for r in RPC[c]:
                try:v=rpc(r,a);src=r;break
                except Exception as e:errs.append(r+":"+repr(e))
            if v is None:return {"network":n,"chain_id":c,"address":a,"url":u,"error":" | ".join(errs)}
            raw=dec(v); conf=None
            if raw!=0:
              for r in RPC[c]:
                if r==src:continue
                try:
                  v2=rpc(r,a); raw2=dec(v2); conf={"rpc":r,"result":v2,"raw_int32":raw2,"matches":raw2==raw}
                  if raw2==raw:break
                except Exception:pass
            return {"network":n,"chain_id":c,"address":a,"url":u,"source":src,"result":v,"raw_int32":raw,"annual_percent":raw/10000,"confirmation":conf,"errors":errs}
          rows=[]
          with ThreadPoolExecutor(max_workers=21) as ex:
            fs=[ex.submit(one,t) for t in T]
            for f in as_completed(fs):rows.append(f.result())
          rows.sort(key=lambda r:(r["chain_id"],r["address"].lower()))
          ok=[r for r in rows if "raw_int32" in r]; fail=[r for r in rows if "error" in r]
          out={"checked_at_utc":datetime.now(timezone.utc).isoformat(),"target_count":21,"success_count":len(ok),"failure_count":len(fail),"nonzero":[r for r in ok if r["raw_int32"]!=0],"results":ok,"failures":fail}
          print("FSL_RESULT_JSON="+json.dumps(out,separators=(",",":")))
