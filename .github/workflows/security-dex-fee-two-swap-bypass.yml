name: Security DexFeeHandler two-swap bypass

on:
  push:
    branches:
      - audit/cross-module-high-critical-20260805
    paths:
      - 'test/security/DexFeeHandlerTwoSwapBypass.t.sol'
      - '.github/workflows/security-dex-fee-two-swap-bypass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAINNET_RPC_URL: 'https://ethereum-rpc.publicnode.com'
    steps:
      - name: Checkout with dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve fresh Ethereum block
        shell: bash
        run: |
          MAINNET_FORK_BLOCK="$(cast block-number --rpc-url "$MAINNET_RPC_URL")"
          echo "MAINNET_FORK_BLOCK=$MAINNET_FORK_BLOCK" >> "$GITHUB_ENV"
          echo "Fork block: $MAINNET_FORK_BLOCK"

      - name: Prepare isolated harness
        shell: bash
        run: |
          mkdir -p audit/dex-fee-bypass/test audit/dex-fee-bypass/src audit/dex-fee-bypass/lib evidence-dex-fee-bypass
          cp test/security/DexFeeHandlerTwoSwapBypass.t.sol audit/dex-fee-bypass/test/
          ln -s "$GITHUB_WORKSPACE/lib/forge-std" audit/dex-fee-bypass/lib/forge-std
          cat > audit/dex-fee-bypass/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          solc_version = "0.8.21"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          gas_limit = "18446744073709551615"
          EOF

      - name: Run bypass and closed-cycle PnL probe
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --root audit/dex-fee-bypass \
            --match-path test/DexFeeHandlerTwoSwapBypass.t.sol \
            -vvvv 2>&1 | tee evidence-dex-fee-bypass/bypass.log

      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E "(BestCandidate|ClosedCycle|BypassSummary|Suite result|Failing tests|Error:)" \
            evidence-dex-fee-bypass/bypass.log \
            | tee evidence-dex-fee-bypass/bypass-summary.log || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dex-fee-two-swap-bypass
          path: evidence-dex-fee-bypass/
          if-no-files-found: error
          retention-days: 30
