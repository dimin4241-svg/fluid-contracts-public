name: Plasma T4 pure DEX close smoke V2

on:
  push:
    branches:
      - audit/plasma-t4-exact-debt-controls-20260806
    paths:
      - 'test/security/PlasmaVaultT4PureDexDebtCloseSmokeV2.t.sol'
      - '.github/workflows/plasma-t4-pure-dex-close-smoke-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
      PLASMA_FORK_BLOCK: 29082579
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated test
        shell: bash
        run: |
          rm -rf audit/t4-pure-dex-smoke-v2
          mkdir -p audit/t4-pure-dex-smoke-v2/test audit/t4-pure-dex-smoke-v2/lib evidence-v2
          cp test/security/PlasmaVaultT4PureDexDebtCloseSmokeV2.t.sol audit/t4-pure-dex-smoke-v2/test/
          cp -R lib/forge-std audit/t4-pure-dex-smoke-v2/lib/forge-std
      - name: Run pinned fork test
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/t4-pure-dex-smoke-v2 --via-ir \
            --match-path test/PlasmaVaultT4PureDexDebtCloseSmokeV2.t.sol -vvvv 2>&1 \
            | tee evidence-v2/smoke-v2.log
      - name: Summarize
        if: always()
        shell: bash
        run: |
          grep -E '(SurfaceV2|BaselineV2|PerturbV2|InteractionV2)\(|Suite result|Failing tests|Error:|revert' \
            evidence-v2/smoke-v2.log | tee evidence-v2/summary.log || true
          echo "$PLASMA_FORK_BLOCK" > evidence-v2/block.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-t4-pure-dex-close-smoke-v2
          path: evidence-v2/
          if-no-files-found: error
          retention-days: 30
