name: fSL automation runner

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - .github/fsl-automation-trigger.txt

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet requests
      - name: Check all 21 canonical fSL feeOrReward values
        shell: bash
        run: |
          set +e
          mkdir -p security-results
          python scripts/security/check_fsl_fee_or_reward.py > security-results/fsl-automation-latest.json
          code=$?
          printf '%s\n' "$code" > security-results/fsl-automation-latest.exit
          set -e
      - name: Commit check output
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add security-results/fsl-automation-latest.json security-results/fsl-automation-latest.exit
          git commit -m "Record fresh fSL automation check" || exit 0
          git push origin HEAD:audit/read-only-dex-fees-20260805
