name: fSL automation runner

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - .github/fsl-automation-trigger.txt

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet requests
      - name: Check all 21 canonical fSL feeOrReward values
        run: python scripts/security/check_fsl_fee_or_reward.py
