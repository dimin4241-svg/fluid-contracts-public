name: fSL feeOrReward runtime check

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Check all fSL feeOrReward values
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > /tmp/fsl_fee_watch_latest.json 2> /tmp/fsl_fee_watch_latest.err
          code=$?
          set -e
          cat /tmp/fsl_fee_watch_latest.json
          cat /tmp/fsl_fee_watch_latest.err >&2 || true
          mkdir -p security
          cp /tmp/fsl_fee_watch_latest.json security/fsl_fee_watch_latest.json
          printf '%s\n' "$code" > security/fsl_fee_watch_latest.exitcode
      - name: Commit runtime result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security/fsl_fee_watch_latest.json security/fsl_fee_watch_latest.exitcode
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record fSL feeOrReward runtime result'
          git push origin HEAD:audit/read-only-dex-fees-20260805
