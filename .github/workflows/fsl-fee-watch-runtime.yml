name: fSL feeOrReward runtime check

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Check all fSL feeOrReward values
        continue-on-error: true
        run: python scripts/security/check_fsl_fee_or_reward.py
