name: fSL feeOrReward watch
on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run fSL checker
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee fsl-result.json
          code=${PIPESTATUS[0]}
          echo "checker_exit=$code"
          if [ "$code" -eq 2 ]; then exit 2; fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsl-feeor-reward-result
          path: fsl-result.json
