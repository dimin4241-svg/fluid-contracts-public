name: Security Plasma GHO-USDT micro-swap optimizer

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - 'test/security/PlasmaGhoUsdtMicroSwapOptimizer.t.sol'
      - '.github/workflows/security-plasma-gho-usdt-optimizer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated harness
        shell: bash
        run: |
          mkdir -p audit/fork-poc/src audit/fork-poc/test evidence-plasma-optimizer
          cp test/security/PlasmaGhoUsdtMicroSwapOptimizer.t.sol audit/fork-poc/test/
      - name: Run deployed profit-per-gas optimizer
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/fork-poc --via-ir \
            --match-path test/PlasmaGhoUsdtMicroSwapOptimizer.t.sol \
            -vvvv 2>&1 | tee evidence-plasma-optimizer/optimizer.log
      - name: Extract optimizer evidence
        if: always()
        shell: bash
        run: |
          grep -E 'Candidate\(|Best\(|Suite result|Failing tests|Error:' \
            evidence-plasma-optimizer/optimizer.log \
            | tee evidence-plasma-optimizer/optimizer-summary.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-gho-usdt-optimizer
          path: evidence-plasma-optimizer/
          if-no-files-found: error
          retention-days: 30
