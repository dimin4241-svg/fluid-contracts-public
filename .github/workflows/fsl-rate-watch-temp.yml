name: Temporary fSL rate check

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  check:
    if: github.event.issue.pull_request && github.event.comment.body == '/run-fsl-rate-check-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Check all 21 canonical Routescan calls
