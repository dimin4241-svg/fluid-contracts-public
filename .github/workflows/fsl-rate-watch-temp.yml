          ('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c','https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api?action=eth_call&data=0xe47a882d&module=proxy&tag=latest&to=0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c')]
          R={1:['https://ethereum-rpc.publicnode.com','https://rpc.ankr.com/eth'],8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],9745:['https://rpc.plasma.to','https://plasma.drpc.org']}
          def dec(x):
            v=int(x,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def rpc(cid,a):
            p={'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':a,'data':S},'latest']}
            es=[]
            for r in R[cid]:
              try:
                j=requests.post(r,json=p,timeout=30).json(); x=j.get('result')
                if isinstance(x,str) and x.startswith('0x'): return x,r
                es.append({r:j})
              except Exception as e: es.append({r:repr(e)})
            raise RuntimeError(str(es))
          def one(t):
            n,c,a,u=t; es=[]
            x=None; src=None
            for i in range(3):
              try:
                j=requests.get(u,timeout=30).json(); y=j.get('result')
                if isinstance(y,str) and y.startswith('0x'): x=y; src='routescan'; break
                es.append({'routescan':j})
              except Exception as e: es.append({'routescan':repr(e)})
              time.sleep(i+1)
            if x is None:
              try: x,src=rpc(c,a)
              except Exception as e: return {'network':n,'chain_id':c,'address':a,'canonical_routescan_url':u,'error':str(e),'routescan_errors':es}
            raw=dec(x); conf=None
            if raw!=0:
              try:
                y,r=rpc(c,a); conf={'rpc':r,'result':y,'raw_int32':dec(y),'match':y.lower()==x.lower() and dec(y)==raw}
                if not conf['match']: return {'network':n,'chain_id':c,'address':a,'canonical_routescan_url':u,'error':'nonzero confirmation mismatch','result':x,'raw_int32':raw,'independent_confirmation':conf}
              except Exception as e: return {'network':n,'chain_id':c,'address':a,'canonical_routescan_url':u,'error':'nonzero confirmation failed: '+str(e),'result':x,'raw_int32':raw}
            return {'network':n,'chain_id':c,'address':a,'canonical_routescan_url':u,'source':src,'result':x,'raw_int32':raw,'annual_percent':raw/10000,'independent_confirmation':conf}
          with concurrent.futures.ThreadPoolExecutor(max_workers=21) as ex: rows=list(ex.map(one,T))
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          out={'checked_at_utc':now,'target_count':21,'success_count':sum('raw_int32' in r and 'error' not in r for r in rows),'failure_count':sum('error' in r for r in rows),'nonzero':[r for r in rows if r.get('raw_int32') not in (None,0) and 'error' not in r],'results':rows,'failures':[r for r in rows if 'error' in r]}
