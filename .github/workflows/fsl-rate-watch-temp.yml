name: Temporary fSL rate check

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  check:
    if: github.event.issue.pull_request && github.event.comment.body == '/run-fsl-rate-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check all fSL contracts
        shell: bash
        run: |
          python - <<'PY'
          import requests, json, datetime, concurrent.futures
          targets = [
            ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
            ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c')
          ]
          fallbacks={1:['https://ethereum-rpc.publicnode.com','https://rpc.ankr.com/eth'],8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']}
          def dec(res):
            v=int(res,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def check(t):
            net,cid,addr=t; errs=[]
            url=f'https://api.routescan.io/v2/network/mainnet/evm/{cid}/etherscan/api?module=proxy&action=eth_call&to={addr}&data=0xe47a882d&tag=latest'
            for _ in range(3):
              try:
                j=requests.get(url,timeout=30).json(); res=j.get('result')
                if isinstance(res,str) and res.startswith('0x'):
                  raw=dec(res); return {'network':net,'chain_id':cid,'address':addr,'source':'routescan','result':res,'raw':raw,'annual_percent':raw/10000}
                errs.append({'routescan':j})
              except Exception as e: errs.append({'routescan_error':repr(e)})
            p={'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':addr,'data':'0xe47a882d'},'latest']}
            for rpc in fallbacks[cid]:
              try:
                j=requests.post(rpc,json=p,timeout=30).json(); res=j.get('result')
                if isinstance(res,str) and res.startswith('0x'):
                  raw=dec(res); return {'network':net,'chain_id':cid,'address':addr,'source':rpc,'result':res,'raw':raw,'annual_percent':raw/10000}
                errs.append({rpc:j})
              except Exception as e: errs.append({rpc:repr(e)})
            return {'network':net,'chain_id':cid,'address':addr,'error':errs}
          with concurrent.futures.ThreadPoolExecutor(max_workers=21) as ex: rows=list(ex.map(check,targets))
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'target_count':len(targets),'success_count':sum('raw' in x for x in rows),'results':rows,'nonzero':[x for x in rows if x.get('raw') not in (None,0)],'failures':[x for x in rows if 'error' in x]}
          open('fsl-temp-result.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fsl-temp-result.json
          git commit -m 'Record temporary fSL feeOrReward check result' || exit 0
          git push origin HEAD:main
