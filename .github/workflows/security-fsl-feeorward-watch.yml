name: Security fSL feeOrReward watch
on:
  pull_request:
    paths:
      - 'scripts/security/check_fsl_fee_or_reward.py'
      - '.github/workflows/security-fsl-feeorward-watch.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Run all 21 fSL feeOrReward checks
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee fsl-feeorward.json
          code=${PIPESTATUS[0]}
          echo "CHECK_EXIT=$code"
          cat fsl-feeorward.json
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-feeorward-result
          path: fsl-feeorward.json
