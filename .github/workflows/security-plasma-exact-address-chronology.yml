name: Plasma corrected stateful and rebalance proof

on:
  push:
    branches:
      - audit/plasma-t4-liquidation-20260806
    paths:
      - 'test/security/PlasmaVaultT4OneSidedBorrowLiquidationV2.t.sol'
      - '.github/workflows/security-plasma-exact-address-chronology.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasma-corrected-stateful-rebalance
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
      PLASMA_FORK_BLOCK: 29082579
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated proof root
        shell: bash
        run: |
          rm -rf audit/corrected-proof
          mkdir -p audit/corrected-proof/test audit/corrected-proof/lib evidence-corrected-proof
          cp test/security/PlasmaVaultT4OneSidedBorrowLiquidationV2.t.sol audit/corrected-proof/test/
          cp -R lib/forge-std audit/corrected-proof/lib/forge-std
      - name: Run pinned proof
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/corrected-proof --via-ir \
            --match-contract PlasmaVaultT4OneSidedBorrowLiquidationV2Test \
            --match-test test_feasibleOneSidedBorrowLiquidation -vvvv 2>&1 \
            | tee evidence-corrected-proof/proof.log
      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E '(RebalanceAuth|FeasibleCase|FeasibleDeposit|FeasibleBorrow|FeasibleLiquidation)\(|Suite result|Failing tests|Error:|revert' \
            evidence-corrected-proof/proof.log | tee evidence-corrected-proof/summary.log || true
          git rev-parse HEAD > evidence-corrected-proof/commit.txt
          echo "$PLASMA_FORK_BLOCK" > evidence-corrected-proof/block.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-corrected-stateful-rebalance
          path: evidence-corrected-proof/
          if-no-files-found: error
          retention-days: 30
