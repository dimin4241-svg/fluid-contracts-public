name: Temporary fSL live check

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-fsl-live-check.yml']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Query every fSL target
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY' > artifacts/fsl-live-check.json
          import json, time
          from datetime import datetime, timezone
          import requests

          selector='0xe47a882d'
          targets=[
          ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
          ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
          ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c')]
          rpcs={1:['https://ethereum-rpc.publicnode.com','https://rpc.ankr.com/eth'],8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']}
          s=requests.Session(); s.headers['User-Agent']='fsl-live-check/1.0'
          out=[]; failures=[]; checked=datetime.now(timezone.utc).isoformat()
          def dec(x):
              v=int(x,16)&0xffffffff
              return v-(1<<32) if v&0x80000000 else v
          for network,cid,address in targets:
              url=f'https://api.routescan.io/v2/network/mainnet/evm/{cid}/etherscan/api?module=proxy&action=eth_call&to={address}&data={selector}&tag=latest'
              result=None; source=None; errs=[]
              for i in range(3):
                  try:
                      j=s.get(url,timeout=30).json(); x=j.get('result')
                      if isinstance(x,str) and x.startswith('0x'): result=x; source='routescan'; break
                      errs.append(f'routescan payload {j}')
                  except Exception as e: errs.append(f'routescan {e!r}')
                  time.sleep(i+1)
              if result is None:
                  payload={'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':address,'data':selector},'latest']}
                  for rpc in rpcs[cid]:
                      try:
                          j=s.post(rpc,json=payload,timeout=30).json(); x=j.get('result')
                          if isinstance(x,str) and x.startswith('0x'): result=x; source=rpc; break
                          errs.append(f'{rpc} payload {j}')
                      except Exception as e: errs.append(f'{rpc} {e!r}')
              if result is None:
                  failures.append({'network':network,'chain_id':cid,'address':address,'errors':errs}); continue
              raw=dec(result)
              out.append({'network':network,'chain_id':cid,'address':address,'result':result,'raw_int32':raw,'annual_percent':raw/10000,'source':source,'checked_at_utc':checked})
          print(json.dumps({'checked_at_utc':checked,'target_count':len(targets),'success_count':len(out),'failure_count':len(failures),'nonzero':[x for x in out if x['raw_int32']!=0],'results':out,'failures':failures},indent=2))
          PY
      - name: Commit check output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/fsl-live-check.json
          git commit -m 'Record temporary fSL live check result' || exit 0
          git push
