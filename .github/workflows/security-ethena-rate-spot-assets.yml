name: Security Ethena rate spot-assets probe

on:
  push:
    branches:
      - audit/cross-module-high-critical-20260805
    paths:
      - 'test/security/EthenaRateSpotAssetsManipulation.t.sol'
      - '.github/workflows/security-ethena-rate-spot-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAINNET_RPC_URL: 'https://ethereum-rpc.publicnode.com'
    steps:
      - name: Checkout with dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Resolve fresh Ethereum block
        shell: bash
        run: |
          MAINNET_FORK_BLOCK="$(cast block-number --rpc-url "$MAINNET_RPC_URL")"
          echo "MAINNET_FORK_BLOCK=$MAINNET_FORK_BLOCK" >> "$GITHUB_ENV"
          echo "Fork block: $MAINNET_FORK_BLOCK"
      - name: Prepare isolated harness
        shell: bash
        run: |
          mkdir -p audit/ethena-rate-spot-assets/test audit/ethena-rate-spot-assets/src audit/ethena-rate-spot-assets/lib evidence-ethena-rate-spot-assets
          cp test/security/EthenaRateSpotAssetsManipulation.t.sol audit/ethena-rate-spot-assets/test/
          ln -s "$GITHUB_WORKSPACE/lib/forge-std" audit/ethena-rate-spot-assets/lib/forge-std
          cat > audit/ethena-rate-spot-assets/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          solc_version = "0.8.21"
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          gas_limit = "18446744073709551615"
          EOF
      - name: Run spot-assets probe
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --root audit/ethena-rate-spot-assets \
            --match-path test/EthenaRateSpotAssetsManipulation.t.sol \
            -vvvv 2>&1 | tee evidence-ethena-rate-spot-assets/probe.log
      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E "(Baseline|DepositProbe|PersistenceProbe|Suite result|Failing tests|Error:)" \
            evidence-ethena-rate-spot-assets/probe.log \
            | tee evidence-ethena-rate-spot-assets/summary.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ethena-rate-spot-assets-probe
          path: evidence-ethena-rate-spot-assets/
          if-no-files-found: error
          retention-days: 30
