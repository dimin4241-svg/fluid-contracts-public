name: Temporary fSL feeOrReward check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run exhaustive fSL on-chain check
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py
          code=$?
          echo "CHECK_EXIT_CODE=$code"
          exit 0
