name: fSL on-chain probe 2026-08-18 17:43 UTC

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - .github/workflows/fsl-onchain-probe-20260818-1743.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
          fetch-depth: 0

      - name: Probe all 21 canonical Routescan URLs
        shell: bash
        run: |
          mkdir -p automation-results
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          SELECTOR='0xe47a882d'
          TARGETS=[
            ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),
            ('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
            ('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
            ('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
            ('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),
            ('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),
            ('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
            ('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),
            ('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),
            ('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
            ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),
            ('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),
            ('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),
            ('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),
            ('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),
            ('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),
            ('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),
            ('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c'),
          ]
          RPCS={
            1:['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com'],
            8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],
            137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],
            42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],
            9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com'],
          }

          def routescan_url(cid,addr):
            return f'https://api.routescan.io/v2/network/mainnet/evm/{cid}/etherscan/api?action=eth_call&data={SELECTOR}&module=proxy&tag=latest&to={addr}'

          def get_json(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 fsl-watch'})
            with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              return r.status, body, json.loads(body)

          def post_rpc(url,addr):
            payload=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':addr,'data':SELECTOR},'latest']}).encode()
            req=urllib.request.Request(url,data=payload,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 fsl-watch'})
            with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              return r.status, body, json.loads(body)

          def valid_result(v):
            if not isinstance(v,str) or not v.startswith('0x'):
              return False
            try: int(v,16)
            except: return False
            return len(v) >= 3

          def decode(v):
            x=int(v,16)&0xffffffff
            return x-(1<<32) if x&0x80000000 else x

          checked=datetime.now(timezone.utc).isoformat()
          out=[]
          for network,cid,addr in TARGETS:
            u=routescan_url(cid,addr)
            item={'network':network,'chain_id':cid,'address':addr,'canonical_url':u,'checked_at_utc':checked}
            rs_ok=False
            try:
              status,body,j=get_json(u)
              item['routescan_http_status']=status
              item['routescan_body']=body[:2000]
              res=j.get('result')
              if valid_result(res):
                rs_ok=True
                item['result']=res
                item['raw_int32']=decode(res)
                item['annual_percent']=item['raw_int32']/10000
                item['routescan_confirmed']=True
              else:
                item['routescan_confirmed']=False
                item['routescan_error']=f'invalid result: {j!r}'
            except Exception as e:
              item['routescan_confirmed']=False
              item['routescan_error']=repr(e)

            # If Routescan failed/ambiguous, use fallback to establish the value.
            # If Routescan is nonzero, ALWAYS independently confirm using fallback RPC.
            need_fallback=(not rs_ok) or (item.get('raw_int32',0)!=0)
            if need_fallback:
              item['fallback_attempts']=[]
              for rpc in RPCS.get(cid,[]):
                a={'rpc':rpc}
                try:
                  status,body,j=post_rpc(rpc,addr)
                  a['http_status']=status; a['body']=body[:2000]
                  res2=j.get('result')
                  if valid_result(res2):
                    a['result']=res2; a['raw_int32']=decode(res2); a['annual_percent']=a['raw_int32']/10000
                    item['fallback_attempts'].append(a)
                    item['fallback_confirmed']=True
                    item['fallback_result']=res2
                    item['fallback_raw_int32']=a['raw_int32']
                    item['fallback_rpc']=rpc
                    if not rs_ok:
                      item['result']=res2; item['raw_int32']=a['raw_int32']; item['annual_percent']=a['annual_percent']
                    break
                  a['error']=f'invalid result: {j!r}'
                except Exception as e:
                  a['error']=repr(e)
                item['fallback_attempts'].append(a)
              else:
                item['fallback_confirmed']=False

            if item.get('raw_int32',0)!=0:
              item['nonzero_independently_confirmed']=(item.get('routescan_confirmed') is True and item.get('fallback_confirmed') is True and item.get('fallback_raw_int32')==item.get('raw_int32'))
            out.append(item)

          summary={
            'checked_at_utc':checked,
            'target_count':len(TARGETS),
            'routescan_confirmed_count':sum(1 for x in out if x.get('routescan_confirmed')),
            'value_confirmed_count':sum(1 for x in out if 'raw_int32' in x),
            'unconfirmed_count':sum(1 for x in out if 'raw_int32' not in x),
            'nonzero_count':sum(1 for x in out if x.get('raw_int32',0)!=0),
            'confirmed_nonzero_count':sum(1 for x in out if x.get('nonzero_independently_confirmed')),
            'results':out,
          }
          with open('automation-results/fsl-fee-check-auto-20260818-1743.json','w') as f:
            json.dump(summary,f,indent=2)
          print(json.dumps(summary,indent=2))
          PY

      - name: Commit probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation-results/fsl-fee-check-auto-20260818-1743.json
          git commit -m 'Record fSL feeOrReward probe 2026-08-18 17:43 UTC' || exit 0
          git push origin HEAD:audit/read-only-dex-fees-20260805
