name: Security low-fee exact-output fork PoC

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - name: Checkout with test dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated fork harness
        shell: bash
        run: |
          mkdir -p audit/fork-poc/src audit/fork-poc/test
          cp test/security/LowFeeExactOutRoundTrip.t.sol audit/fork-poc/test/LowFeeExactOutRoundTrip.t.sol
          sed -i 's/25_686_659/25_686_672/' audit/fork-poc/test/LowFeeExactOutRoundTrip.t.sol
          sed -i 's/0x91716c4eda1fb55e84bf8b4c7085f84285c19085/0x91716C4EDA1Fb55e84Bf8b4c7085f84285c19085/' audit/fork-poc/test/LowFeeExactOutRoundTrip.t.sol
          sed -i 's/0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee/0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE/' audit/fork-poc/test/LowFeeExactOutRoundTrip.t.sol
          sed -i 's/snapshotState()/snapshot()/g; s/revertToState/revertTo/g' audit/fork-poc/test/LowFeeExactOutRoundTrip.t.sol
      - name: Run fixed-block stateful round-trip search
        shell: bash
        run: |
          set -o pipefail
          forge test \
            --root audit/fork-poc \
            --match-path test/LowFeeExactOutRoundTrip.t.sol \
            --match-test test_statefulRoundTripSearchOnEveryActiveLowFeePool \
            -vvvv 2>&1 | tee low-fee-roundtrip-fork.log
      - name: Upload PoC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-fee-roundtrip-fork-log
          path: low-fee-roundtrip-fork.log
          if-no-files-found: warn
