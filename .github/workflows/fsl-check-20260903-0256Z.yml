name: fSL check 2026-09-03 02:56Z
on:
  push:
    branches: [audit/read-only-dex-fees-20260805]
    paths: ['.github/workflows/fsl-check-20260903-0256Z.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/read-only-dex-fees-20260805
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Check all 21 deployed fSL contracts
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee /tmp/fsl.out
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/fsl.exit
          cp fsl_fee_or_reward_results.json scripts/security/fsl_fee_or_reward_runtime_latest.json
          cp /tmp/fsl.exit scripts/security/fsl_fee_or_reward_runtime_latest.exit
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/security/fsl_fee_or_reward_runtime_latest.json scripts/security/fsl_fee_or_reward_runtime_latest.exit
          git diff --cached --quiet || git commit -m 'chore: persist 2026-09-03 fSL feeOrReward check'
          git push origin HEAD:audit/read-only-dex-fees-20260805
          exit 0
