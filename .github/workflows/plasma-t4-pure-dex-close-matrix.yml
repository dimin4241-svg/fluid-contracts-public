name: Plasma T4 pure DEX debt close matrix

on:
  push:
    branches:
      - audit/plasma-t4-exact-debt-controls-20260806
    paths:
      - 'test/security/PlasmaVaultT4PureDexDebtCloseMatrix.t.sol'
      - '.github/workflows/plasma-t4-pure-dex-close-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
      PLASMA_FORK_BLOCK: 29082579
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated matrix
        shell: bash
        run: |
          rm -rf audit/t4-pure-dex-matrix
          mkdir -p audit/t4-pure-dex-matrix/test audit/t4-pure-dex-matrix/lib evidence-matrix
          cp test/security/PlasmaVaultT4PureDexDebtCloseMatrix.t.sol audit/t4-pure-dex-matrix/test/
          cp -R lib/forge-std audit/t4-pure-dex-matrix/lib/forge-std
      - name: Run pinned three-control matrix
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/t4-pure-dex-matrix --via-ir \
            --match-path test/PlasmaVaultT4PureDexDebtCloseMatrix.t.sol -vvvv 2>&1 \
            | tee evidence-matrix/matrix.log
      - name: Extract numerical evidence
        if: always()
        shell: bash
        run: |
          grep -E '(MatrixSurface|MatrixBaseline|MatrixPerturb|MatrixInteraction|MatrixScaleCheck|MatrixPositionComparison)\(|Suite result|Failing tests|Error:|revert' \
            evidence-matrix/matrix.log | tee evidence-matrix/summary.log || true
          echo "$PLASMA_FORK_BLOCK" > evidence-matrix/block.txt
          git rev-parse HEAD > evidence-matrix/commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-t4-pure-dex-close-matrix
          path: evidence-matrix/
          if-no-files-found: error
          retention-days: 30
