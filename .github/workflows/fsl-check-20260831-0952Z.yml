              for rpc in F[c]:
                try:
                  j=post(rpc,a); s=j.get('result')
                  if not(isinstance(s,str) and s.startswith('0x')): raise Exception(repr(j))
                  rec['fallback_attempts'].append({'rpc':rpc,'result':s,'raw_int32':dec(s)})
                  rec.update(fallback_confirmed=True,fallback_rpc=rpc,fallback_result=s,fallback_raw_int32=dec(s))
                  if not rec['routescan_confirmed']: rec.update(result=s,raw_int32=dec(s),annual_percent=dec(s)/10000)
                  break
                except Exception as e: rec['fallback_attempts'].append({'rpc':rpc,'error':repr(e)})
              else: rec['fallback_confirmed']=False
            if rec.get('raw_int32',0)!=0:
              rec['nonzero_independently_confirmed']=bool(rec.get('routescan_confirmed') and rec.get('fallback_confirmed') and rec.get('fallback_raw_int32')==rec.get('raw_int32'))
            out.append(rec)
          summary={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'target_count':21,'value_confirmed_count':sum('raw_int32' in x for x in out),'unconfirmed_count':sum('raw_int32' not in x for x in out),'nonzero_count':sum(x.get('raw_int32',0)!=0 for x in out),'confirmed_nonzero_count':sum(bool(x.get('nonzero_independently_confirmed')) for x in out),'results':out}
          import os; os.makedirs('automation-results',exist_ok=True)
          open('automation-results/fsl-20260831-0952Z.json','w').write(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
