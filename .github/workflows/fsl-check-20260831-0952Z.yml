          F={1:['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com'],8453:['https://base-rpc.publicnode.com','https://mainnet.base.org'],137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com'],42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc'],9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com']}
          def dec(s):
            v=int(s,16)&0xffffffff
            return v-(1<<32) if v&0x80000000 else v
          def get(u):
            r=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 fsl-watch'})
            with urllib.request.urlopen(r,timeout=25) as x:return json.loads(x.read().decode())
          def post(u,a):
            b=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':a,'data':selector},'latest']}).encode()
            r=urllib.request.Request(u,data=b,headers={'content-type':'application/json','user-agent':'Mozilla/5.0 fsl-watch'})
            with urllib.request.urlopen(r,timeout=25) as x:return json.loads(x.read().decode())
          out=[]
          for n,c,a in T:
            url=f'https://api.routescan.io/v2/network/mainnet/evm/{c}/etherscan/api?action=eth_call&data={selector}&module=proxy&tag=latest&to={a}'
            rec={'network':n,'chain_id':c,'address':a,'canonical_url':url}
            try:
              j=get(url); s=j.get('result')
              if not(isinstance(s,str) and s.startswith('0x')): raise Exception(repr(j))
              rec.update(routescan_confirmed=True,result=s,raw_int32=dec(s),annual_percent=dec(s)/10000)
            except Exception as e:
              rec.update(routescan_confirmed=False,routescan_error=repr(e))
