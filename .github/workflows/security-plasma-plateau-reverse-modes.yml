name: Security Plasma plateau and reverse-mode search

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - 'test/security/PlasmaGhoUsdtPlateauAndReverseModes.t.sol'
      - '.github/workflows/security-plasma-plateau-reverse-modes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLASMA_RPC_URL: 'https://rpc.plasma.to'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated harness
        shell: bash
        run: |
          mkdir -p audit/fork-poc/test evidence-plasma-plateaus
          cp test/security/PlasmaGhoUsdtPlateauAndReverseModes.t.sol audit/fork-poc/test/
      - name: Run plateau and reverse-mode search
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/fork-poc --via-ir \
            --match-path test/PlasmaGhoUsdtPlateauAndReverseModes.t.sol \
            -vvvv 2>&1 | tee evidence-plasma-plateaus/search.log
      - name: Extract summary
        if: always()
        shell: bash
        run: |
          grep -E 'PlateauCandidate\(|Suite result|Failing tests|Compiler run failed|Error:' \
            evidence-plasma-plateaus/search.log \
            | tee evidence-plasma-plateaus/summary.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-plateau-reverse-modes
          path: evidence-plasma-plateaus/
          if-no-files-found: error
          retention-days: 30
