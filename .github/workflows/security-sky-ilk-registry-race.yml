name: Security Sky atomic governance cleanup reversal v3

on:
  push:
    branches:
      - audit/sky-ilk-registry-race-runner-20260806
    paths:
      - '.github/workflows/security-sky-ilk-registry-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Sky PoC branch
        uses: actions/checkout@v4
        with:
          repository: dimin4241-svg/dss-emergency-spells
          ref: audit/ilk-registry-readd-proof
          path: sky-poc
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Select stable archive Ethereum RPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-sky-atomic-reversal
          endpoints=(
            'https://eth-mainnet.public.blastapi.io'
            'https://mainnet.gateway.tenderly.co'
            'https://ethereum-rpc.publicnode.com'
            'https://eth.drpc.org'
          )
          for rpc in "${endpoints[@]}"; do
            stable=1
            for attempt in 1 2; do
              if ! output=$(timeout 30 cast call 0x5a464C28D19848f44199D003BeF5ecc87d090F87 'count()(uint256)' --block 23118263 --rpc-url "$rpc" 2>&1); then
                stable=0
                echo "$rpc attempt=$attempt failed: $output" | tee -a evidence-sky-atomic-reversal/rpc.log
                break
              fi
              echo "$rpc attempt=$attempt count=$output" | tee -a evidence-sky-atomic-reversal/rpc.log
              [[ "$output" =~ ^[0-9]+ ]] || stable=0
            done
            if [[ "$stable" == 1 ]]; then
              echo "ETH_RPC_URL=$rpc" >> "$GITHUB_ENV"
              echo "selected=$rpc" | tee -a evidence-sky-atomic-reversal/rpc.log
              exit 0
            fi
          done
          exit 1

      - name: Run one-transaction real-spell reversal proof
        shell: bash
        working-directory: sky-poc
        run: |
          set -o pipefail
          forge test \
            --match-path src/IlkRegistryAtomicGovernanceReversal.t.sol \
            --match-test testOneUnprivilegedTransactionCastsSpellAndReversesCleanup \
            -vvvv 2>&1 | tee ../evidence-sky-atomic-reversal/forge-test.log

      - name: Extract proof summary
        if: always()
        shell: bash
        run: |
          {
            cat evidence-sky-atomic-reversal/rpc.log 2>/dev/null || true
            grep -E '(PASS|FAIL|Suite result|Failing tests|Error:|spell done|Join-backed cleanup targets|restored atomically|final registry count|atomic call gas used|block gas limit)' evidence-sky-atomic-reversal/forge-test.log 2>/dev/null || true
          } | tee evidence-sky-atomic-reversal/summary.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-atomic-governance-cleanup-reversal-v3
          path: evidence-sky-atomic-reversal/
          if-no-files-found: error
          retention-days: 30
