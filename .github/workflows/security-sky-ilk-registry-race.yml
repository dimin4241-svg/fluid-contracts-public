name: Security Sky persistence and companion actions

on:
  push:
    branches:
      - audit/sky-ilk-registry-race-runner-20260806
    paths:
      - '.github/workflows/security-sky-ilk-registry-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Sky PoC branch
        uses: actions/checkout@v4
        with:
          repository: dimin4241-svg/dss-emergency-spells
          ref: audit/ilk-registry-readd-proof
          path: sky-poc
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Select stable Ethereum RPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-sky-persistence
          endpoints=(
            'https://eth.drpc.org'
            'https://rpc.payload.de'
            'https://eth-mainnet.public.blastapi.io'
            'https://mainnet.gateway.tenderly.co'
            'https://ethereum-rpc.publicnode.com'
          )
          for rpc in "${endpoints[@]}"; do
            if output=$(timeout 30 cast call 0x5a464C28D19848f44199D003BeF5ecc87d090F87 'count()(uint256)' --rpc-url "$rpc" 2>&1) && [[ "$output" =~ ^[0-9]+ ]]; then
              echo "ETH_RPC_URL=$rpc" >> "$GITHUB_ENV"
              echo "selected=$rpc current_registry_count=$output" | tee evidence-sky-persistence/rpc.log
              exit 0
            fi
          done
          exit 1

      - name: Run persistence and companion-action proofs
        shell: bash
        working-directory: sky-poc
        run: |
          set -o pipefail
          forge test \
            --match-path src/IlkRegistryPersistence.t.sol \
            -vvvv 2>&1 | tee ../evidence-sky-persistence/forge-test.log

      - name: Extract proof summary
        if: always()
        shell: bash
        run: |
          {
            cat evidence-sky-persistence/rpc.log 2>/dev/null || true
            grep -E '(PASS|FAIL|Suite result|Failing tests|Error:|restored entries|public removals blocked|registry count after|AAVE Join external collateral balance|AAVE token decimals|Vat/not-authorized|caged adapter|governance cage)' evidence-sky-persistence/forge-test.log 2>/dev/null || true
          } | tee evidence-sky-persistence/summary.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-persistence-and-companion-actions
          path: evidence-sky-persistence/
          if-no-files-found: error
          retention-days: 30
