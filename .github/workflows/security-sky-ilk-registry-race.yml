name: Security Sky IlkRegistry removal race

on:
  push:
    branches:
      - audit/sky-ilk-registry-race-runner-20260806
    paths:
      - '.github/workflows/security-sky-ilk-registry-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Sky PoC branch
        uses: actions/checkout@v4
        with:
          repository: dimin4241-svg/dss-emergency-spells
          ref: audit/ilk-registry-readd-proof
          path: sky-poc
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Select stable archive-capable Ethereum RPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-sky-ilk-registry-race
          endpoints=(
            'https://eth.drpc.org'
            'https://rpc.payload.de'
            'https://eth-mainnet.public.blastapi.io'
            'https://mainnet.gateway.tenderly.co'
            'https://ethereum-rpc.publicnode.com'
            'https://1rpc.io/eth'
          )
          for rpc in "${endpoints[@]}"; do
            echo "Testing $rpc" | tee -a evidence-sky-ilk-registry-race/rpc-selection.log
            stable=1
            for attempt in 1 2; do
              if ! output=$(timeout 30 cast call \
                0x5a464C28D19848f44199D003BeF5ecc87d090F87 \
                'count()(uint256)' \
                --block 23118263 \
                --rpc-url "$rpc" 2>&1); then
                stable=0
                echo "attempt=$attempt failed: $output" | tee -a evidence-sky-ilk-registry-race/rpc-selection.log
                break
              fi
              echo "attempt=$attempt output=$output" | tee -a evidence-sky-ilk-registry-race/rpc-selection.log
              if ! [[ "$output" =~ ^[0-9]+ ]]; then
                stable=0
                break
              fi
            done
            if [[ "$stable" == 1 ]]; then
              echo "ETH_RPC_URL=$rpc" >> "$GITHUB_ENV"
              echo "Selected $rpc" | tee -a evidence-sky-ilk-registry-race/rpc-selection.log
              exit 0
            fi
          done
          echo 'No stable archive-capable RPC endpoint succeeded' | tee -a evidence-sky-ilk-registry-race/rpc-selection.log
          exit 1

      - name: Record exact historical preconditions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'fork_block=23118263'
            echo -n 'registry_count=' && cast call 0x5a464C28D19848f44199D003BeF5ecc87d090F87 'count()(uint256)' --block 23118263 --rpc-url "$ETH_RPC_URL"
            echo -n 'registry_AAVE_join=' && cast call 0x5a464C28D19848f44199D003BeF5ecc87d090F87 'join(bytes32)(address)' 0x414156452d410000000000000000000000000000000000000000000000000000 --block 23118263 --rpc-url "$ETH_RPC_URL"
            echo -n 'AAVE_join_live=' && cast call 0x24e459F61cEAa7b1cE70Dbaea938940A7c5aD46e 'live()(uint256)' --block 23118263 --rpc-url "$ETH_RPC_URL"
            echo -n 'AAVE_join_vat=' && cast call 0x24e459F61cEAa7b1cE70Dbaea938940A7c5aD46e 'vat()(address)' --block 23118263 --rpc-url "$ETH_RPC_URL"
            echo -n 'AAVE_join_ilk=' && cast call 0x24e459F61cEAa7b1cE70Dbaea938940A7c5aD46e 'ilk()(bytes32)' --block 23118263 --rpc-url "$ETH_RPC_URL"
            echo -n 'cleanup_spell_done=' && cast call 0x26009aFf7fE39bF7611d66E0D38CAc43b3A93CD5 'done()(bool)' --block 23118263 --rpc-url "$ETH_RPC_URL"
            echo -n 'cleanup_spell_eta=' && cast call 0x26009aFf7fE39bF7611d66E0D38CAc43b3A93CD5 'eta()(uint256)' --block 23118263 --rpc-url "$ETH_RPC_URL"
          } 2>&1 | tee evidence-sky-ilk-registry-race/historical-preconditions.log

      - name: Run differential real-spell fork proof
        shell: bash
        working-directory: sky-poc
        run: |
          set -o pipefail
          forge test \
            --match-path src/IlkRegistryReAdd.t.sol \
            --match-contract IlkRegistryRemovalRaceTest \
            -vvvv 2>&1 | tee ../evidence-sky-ilk-registry-race/forge-test.log

      - name: Extract proof summary
        if: always()
        shell: bash
        run: |
          {
            cat evidence-sky-ilk-registry-race/rpc-selection.log 2>/dev/null || true
            cat evidence-sky-ilk-registry-race/historical-preconditions.log 2>/dev/null || true
            grep -E '(PASS|FAIL|Suite result|Failing tests|Error:|Victim|count|ghost|AAVE)' evidence-sky-ilk-registry-race/forge-test.log 2>/dev/null || true
          } | tee evidence-sky-ilk-registry-race/summary.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-ilk-registry-removal-race
          path: evidence-sky-ilk-registry-race/
          if-no-files-found: error
          retention-days: 30
