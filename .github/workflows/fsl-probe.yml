name: fSL feeOrReward probe

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - '.github/workflows/fsl-probe.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Probe all fSL contracts
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py | tee fsl_probe.json
          code=${PIPESTATUS[0]}
          echo "probe_exit_code=$code"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-probe
          path: fsl_probe.json
