name: fSL runtime check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check all listed fSL contracts
        shell: bash
        run: |
          cat > /tmp/check.py <<'PY'
          import json, time, urllib.request
          from datetime import datetime, timezone

          SELECTOR = '0xe47a882d'
          TARGETS = [
            ('Base',8453,'0x4563134183e45D9502015db14B263E31781099bB'),
            ('Base',8453,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
            ('Base',8453,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
            ('Base',8453,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Plasma',9745,'0x983107BB3dcb71f3A30176114D8a17c454A62514'),
            ('Plasma',9745,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Polygon',137,'0xa779B6736385930145F4856226Cd3E3691B72458'),
            ('Polygon',137,'0x4563134183e45D9502015db14B263E31781099bB'),
            ('Polygon',137,'0x3F6f85e3EDD95Db7f5D33b287D748dfEA64d92a6'),
            ('Polygon',137,'0x4f0C96408aF08473051Ea3EA1FF3e4F288115A5A'),
            ('Arbitrum',42161,'0x82C53239c4CFC89A8E55A691422af24c18A944b1'),
            ('Arbitrum',42161,'0x1F0bFd9862ae58208d26db0d80797974434EC013'),
            ('Arbitrum',42161,'0xdC1dF9E55f3B7EBD4F19001b294d1e537320BC2E'),
            ('Ethereum',1,'0xb210249Bc59FE77D29eb5F0e566D60CB2B010EF1'),
            ('Ethereum',1,'0x9b1f75ea07723F331996831f6d04AD4900d1A3B3'),
            ('Ethereum',1,'0xD2245ee5C3099d65a3d0fdCecA0f71Cc4aA8f0FF'),
            ('Ethereum',1,'0x44aE65F0d82E339c31c3Db9d4f82aB4D5d2B06B2'),
            ('Ethereum',1,'0x10705D774fBE0a3802d7a915E23F6f2c109Fd77f'),
            ('Ethereum',1,'0x7cA3814E21E96758d27e4e07B8d021DE70fC4Db6'),
            ('Ethereum',1,'0x6Ee1e0FC4435571AABd95ecd441dE93C804d7f70'),
            ('Ethereum',1,'0xe3eA95fBd0B27D3fF27e04a43aa5C4361376597c'),
          ]
          RPCS = {
            1:['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://rpc.ankr.com/eth'],
            8453:['https://base-rpc.publicnode.com','https://mainnet.base.org','https://base.llamarpc.com'],
            137:['https://polygon-bor-rpc.publicnode.com','https://polygon-rpc.com','https://polygon.drpc.org'],
            42161:['https://arbitrum-one-rpc.publicnode.com','https://arb1.arbitrum.io/rpc','https://arbitrum.drpc.org'],
            9745:['https://rpc.plasma.to','https://plasma-rpc.publicnode.com'],
          }

          def get_json(url, timeout=25):
            req=urllib.request.Request(url, headers={'User-Agent':'fsl-watch/1.0','Accept':'application/json'})
            with urllib.request.urlopen(req, timeout=timeout) as r:
              return json.loads(r.read().decode())

          def post_json(url,payload,timeout=25):
            data=json.dumps(payload).encode()
            req=urllib.request.Request(url,data=data,headers={'User-Agent':'fsl-watch/1.0','Content-Type':'application/json','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return json.loads(r.read().decode())

          def decode_int32(result):
            x=int(result,16)&0xffffffff
            return x-(1<<32) if x&0x80000000 else x

          checked=datetime.now(timezone.utc).isoformat()
          results=[]; failures=[]
          for network,cid,address in TARGETS:
            url=f'https://api.routescan.io/v2/network/mainnet/evm/{cid}/etherscan/api?module=proxy&action=eth_call&to={address}&data={SELECTOR}&tag=latest'
            result=None; source=None; errors=[]
            for attempt in range(3):
              try:
                body=get_json(url)
                v=body.get('result')
                if isinstance(v,str) and v.startswith('0x'):
                  result=v; source='routescan'; break
                errors.append(f'routescan invalid: {body}')
              except Exception as e:
                errors.append(f'routescan: {e!r}')
                time.sleep(1+attempt)
            if result is None:
              payload={'jsonrpc':'2.0','id':1,'method':'eth_call','params':[{'to':address,'data':SELECTOR},'latest']}
              for rpc in RPCS.get(cid,[]):
                try:
                  body=post_json(rpc,payload)
                  v=body.get('result')
                  if isinstance(v,str) and v.startswith('0x'):
                    result=v; source=rpc; break
                  errors.append(f'{rpc} invalid: {body}')
                except Exception as e:
                  errors.append(f'{rpc}: {e!r}')
            if result is None:
              failures.append({'network':network,'chain_id':cid,'address':address,'routescan_url':url,'errors':errors})
            else:
              raw=decode_int32(result)
              results.append({'network':network,'chain_id':cid,'address':address,'routescan_url':url,'source':source,'result':result,'raw_int32':raw,'annual_percent':raw/10000,'checked_at_utc':checked})
          out={'checked_at_utc':checked,'target_count':len(TARGETS),'success_count':len(results),'failure_count':len(failures),'nonzero':[x for x in results if x['raw_int32']!=0],'results':results,'failures':failures}
          with open('fsl-result.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY
          python /tmp/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-result
          path: fsl-result.json
          retention-days: 1
          if-no-files-found: error
