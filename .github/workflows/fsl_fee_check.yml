name: fSL feeOrReward live check

on:
  push:
    branches:
      - audit/read-only-dex-fees-20260805
    paths:
      - '.github/workflows/fsl_fee_check.yml'
      - 'scripts/security/check_fsl_fee_or_reward.py'
      - 'security/fsl_trigger.txt'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet requests
      - name: Check all 21 fSL feeOrReward values
        shell: bash
        run: |
          set +e
          python scripts/security/check_fsl_fee_or_reward.py > fsl_check.json
          rc=$?
          cat fsl_check.json
          echo "checker_exit_code=$rc"
          exit 0
