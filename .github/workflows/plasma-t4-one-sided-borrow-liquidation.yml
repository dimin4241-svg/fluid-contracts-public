name: Plasma T4 one-sided borrow liquidation

on:
  push:
    branches:
      - audit/plasma-t4-liquidation-20260806
    paths:
      - 'test/security/PlasmaVaultT4OneSidedBorrowLiquidation.t.sol'
      - '.github/workflows/plasma-t4-one-sided-borrow-liquidation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-sided-borrow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLASMA_RPC_URL: https://rpc.plasma.to
      PLASMA_FORK_BLOCK: 29082579
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare isolated one-sided borrow probe
        shell: bash
        run: |
          rm -rf audit/one-sided-borrow
          mkdir -p audit/one-sided-borrow/test audit/one-sided-borrow/lib evidence-one-sided
          cp test/security/PlasmaVaultT4PureDexDebtCloseMatrixV2.t.sol audit/one-sided-borrow/test/
          cp test/security/PlasmaVaultT4LiquidationSurfaceProbe.t.sol audit/one-sided-borrow/test/
          cp test/security/PlasmaVaultT4OneSidedBorrowLiquidation.t.sol audit/one-sided-borrow/test/
          cp -R lib/forge-std audit/one-sided-borrow/lib/forge-std
      - name: Run one-sided borrow liquidation probe
        shell: bash
        run: |
          set -o pipefail
          forge test --root audit/one-sided-borrow --via-ir \
            --match-contract PlasmaVaultT4OneSidedBorrowLiquidationTest \
            --match-test test_oneSidedBorrowLiquidationReachability -vvvv 2>&1 \
            | tee evidence-one-sided/one-sided.log
      - name: Extract evidence
        if: always()
        shell: bash
        run: |
          grep -E '(OneSidedCaseReachability|OneSidedDepositControl|OneSidedBorrowFlow|OneSidedLiquidationResult)\(|Suite result|Failing tests|Error:|revert' \
            evidence-one-sided/one-sided.log | tee evidence-one-sided/summary.log || true
          echo "$PLASMA_FORK_BLOCK" > evidence-one-sided/block.txt
          git rev-parse HEAD > evidence-one-sided/commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-t4-one-sided-borrow-liquidation
          path: evidence-one-sided/
          if-no-files-found: error
          retention-days: 30
